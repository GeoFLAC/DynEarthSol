# Constant-rate Maxwell material test, adapted from maxwell.cfg for current DES.
# The historical file requires BC type 100 from maxwell.diff. Here a fixed unit
# cell with prescribed normal boundary velocities imposes exactly the same
# constant, trace-free strain rate: exx=-1e-14/s, ezz=+1e-14/s, eyy=0 in 3D.
# All cell nodes lie on boundaries, so no interior velocity transient enters.
# eta=1e22 Pa s, mu=1e10 Pa: tau=1e12 s; run through five relaxation times.
# sigma_zz(t)=2*eta*1e-14*(1-exp(-t/tau)). No historical source patch is needed.
[sim]
modelname = maxwell
max_steps = 5000
output_step_interval = 100
# A finite unused time cadence keeps checkpoint scheduling metadata finite.
output_time_interval_in_yr = 1e20
is_outputting_averaged_fields = no

[mesh]
meshing_option = 1
xlength = 1
ylength = 1
zlength = 1
resolution = 1
quality_check_step_interval = 100
remeshing_option = 0

[control]
gravity = 0
characteristic_speed = 1e-14
inertial_scaling = 1e6
has_thermal_diffusion = no
has_moving_mesh = no
fixed_dt = 1e9

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = 0
vbc_val_x1 = -1e-14
vbc_y0 = 1
vbc_y1 = 1
vbc_val_y0 = 0
vbc_val_y1 = 0
vbc_z0 = 1
vbc_z1 = 1
vbc_val_z0 = -1e-14
vbc_val_z1 = 0
has_winkler_foundation = no
has_water_loading = no
surface_temperature = 273
mantle_temperature = 273

[ic]
weakzone_option = 0

[mat]
rheology_type = maxwell
bulk_modulus = [1e12]
shear_modulus = [1e10]
max_viscosity = 1e22
min_viscosity = 1e22
