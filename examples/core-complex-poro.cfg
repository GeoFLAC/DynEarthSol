# core-complex.cfg with pore-pressure diffusion: a permeable 3 km cover
# (k = 1e-13 m^2, porosity 0.1) over tight basement (k = 1e-17 m^2, porosity 0.02),
# drained top, hydrostatic initial pressure; same mechanical properties in both.
# The cover sets dt by the explicit hydraulic limit, 30-290 times below the
# mechanical dt (9.9e4 s at the start, 1.0e4 s at 30 kyr as the fault refines,
# against 2.9e6 s without diffusion): 38.8 M steps and 42 min on 2 threads, about
# 200 times the cost without diffusion. Meanwhile the basement builds +6.6 MPa on
# the hanging-wall side of the fault and -7.9 MPa in the footwall at 30 kyr, and
# the cover stays hydrostatic. Test case for issue #144.
# NOTE: the "pseudo speed is too slow" guard in compute_mass refuses this model
# (it compares m/s with m^2/s, see #144); it ran with the guard disabled.
[sim]
modelname = core-complex-poro
#max_steps = 20000000
max_time_in_yr = 30000
output_time_interval_in_yr = 1500
# output_step_interval = 100

has_output_during_remeshing = no
is_outputting_averaged_fields = no

[mesh]
meshing_option = 2

xlength = 100e3
ylength = 10e3
zlength = 10e3
resolution = 1e3
largest_size = 10
smallest_size = 0.01

refined_zonex = [0.3, 0.7]
refined_zoney = [0.0, 1.0]
refined_zonez = [0.0, 1.0]

quality_check_step_interval = 500

remeshing_option = 11

[control]
has_hydraulic_diffusion = yes
surface_process_option = 1
surface_diffusivity = 1e-7

dt_fraction = 1.0
inertial_scaling = 1e5

[bc]
hbc_z1 = 1
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = -1e-9
vbc_val_x1 = 1e-9

vbc_y0 = 1
vbc_y1 = 1
vbc_val_y0 = 0
vbc_val_y1 = 0

has_water_loading = no

surface_temperature = 273
mantle_temperature = 273

[ic]
mattype_option = 1
num_mattype_layers = 2
layer_mattypes = [0, 1]
mattype_layer_depths = [0.3]
weakzone_option = 1
weakzone_azimuth = 15
weakzone_inclination = -60
weakzone_halfwidth = 1.2
weakzone_depth_min = 0.5
weakzone_depth_max = 1.0
weakzone_xcenter = 0.5
weakzone_ycenter = 0.5
weakzone_zcenter = 0
weakzone_plstrain = 0.5

[mat]
num_materials = 2
porosity = [0.1, 0.02]
hydraulic_perm = [1e-13, 1e-17]
rheology_type = elasto-plastic
rho0 = [2700]
alpha = [0]
bulk_modulus = [50e9]
shear_modulus = [30e9]
pls0 = [0]
pls1 = [0.5]
cohesion0 = [4.4e7]
cohesion1 = [4e6]
friction_angle0 = [30]
friction_angle1 = [30]

min_viscosity = 1e24


[monitor]
output_pore_pressure = yes
