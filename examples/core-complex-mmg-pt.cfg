[sim]
modelname = ccmmg-pt
#max_steps = 20000000
max_time_in_yr = 500000
#output_time_interval_in_yr = 250
output_step_interval = 10

has_output_during_remeshing = no
is_outputting_averaged_fields = no

checkpoint_frame_interval = 20
#is_restarting = yes
#restarting_from_modelname = result2
#restarting_from_frame = 120
info_display_step_interval = 1

[mesh]
meshing_option = 2

xlength = 100e3
ylength = 10e3
zlength = 10e3
resolution = 1e3
largest_size = 10
smallest_size = 0.001

refined_zonex = [0.3, 0.7]
refined_zoney = [0.0, 1.0]
refined_zonez = [0.0, 1.0]

quality_check_step_interval = 1
min_quality = 0.2
max_boundary_distortion = 0.2

remeshing_option = 11

mmg_debug = 1
mmg_verbose = 5
mmg_hmax_factor = 2.0
mmg_hmin_factor = 0.2
mmg_hausd_factor = 0.01

[control]
has_thermal_diffusion = no
has_PT = yes
PT_info_interval = 100
PT_jump = no
PT_max_iter = 100000
PT_relative_tolerance = 1e-6
PT_stagnation_window = 3000
# Cap dt so no element traverses more than this fraction of its weakening
# ramp per step (0 = disabled).
PT_dpls_fraction = 0.1
# Accelerated PT parameters (Räss et al. 2022); values below are the code
# defaults, made explicit here.
PT_Re = 14.9013878     # numerical Reynolds number Re = 3*sqrt(10)/2*pi (Eq. 31)
PT_CFL = 0.519615      # CFL-like stability factor = 0.9/sqrt(NDIMS), NDIMS=3 (Eq. 8)
PT_r = 0.5             # bulk-to-shear pseudo-modulus ratio K~/G~ (Eq. 32)
PT_char_length = 0     # characteristic length L [m]; 0 = auto = max(x,y,z length)

surface_process_option = 1
surface_diffusivity = 1e-6

dt_fraction = 0.1
inertial_scaling = 1e4

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = -1e-9
vbc_val_x1 = 1e-9

vbc_y0 = 1
vbc_y1 = 1
vbc_val_y0 = 0
vbc_val_y1 = 0

has_water_loading = no

surface_temperature = 273
mantle_temperature = 273

[ic]
weakzone_option = 1
weakzone_azimuth = 15
weakzone_inclination = -60
weakzone_halfwidth = 1.2
weakzone_depth_min = 0.0
weakzone_depth_max = 0.5
weakzone_xcenter = 0.5
weakzone_ycenter = 0.5
weakzone_zcenter = 0
weakzone_plstrain = 0.5

[mat]
rheology_type = elasto-plastic
rho0 = [2700]
alpha = [0]
bulk_modulus = [50e9]
shear_modulus = [30e9]
pls0 = [0]
pls1 = [0.5]
cohesion0 = [4.4e8]
cohesion1 = [4e6]
friction_angle0 = [30]
friction_angle1 = [10]

min_viscosity = 1e24

