# 2D PT retune demonstration
# Elasto-plastic model with a pre-softened weak zone.
# Strong extension drives the background material toward yield by step 2,
# so the periodic retune fires and reduces G_e for near-yield elements.
# Run twice: PT_retune_interval = 0 vs 100.

[sim]
modelname = pt-retune-demo
max_steps = 5
output_step_interval = 5

[mesh]
meshing_option = 1
xlength = 100e3
ylength = 10e3
zlength = 25e3
resolution = 5e3
quality_check_step_interval = 5

[control]
has_PT = yes
PT_max_iter = 10000
PT_relative_tolerance = 1e-6
PT_info_interval = 100
PT_retune_interval = 0
gravity = 9.81
dt_fraction = 1.0

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = -1e-9
vbc_val_x1 =  1e-9
surface_temperature = 273
mantle_temperature = 1600

[ic]
mattype_option = 0
temperature_option = 1

weakzone_option = 1
weakzone_inclination = -60
weakzone_halfwidth = 2.0
weakzone_depth_min = 0.0
weakzone_depth_max = 1.0
weakzone_xcenter = 0.5
weakzone_zcenter = 0.0
weakzone_plstrain = 0.5

[mat]
rheology_type = elasto-plastic
rho0 = [2700]
bulk_modulus = [50e9]
shear_modulus = [30e9]
pls0 = [0]
pls1 = [0.5]
cohesion0 = [4.4e7]
cohesion1 = [4e5]
friction_angle0 = [30]
friction_angle1 = [5]
dilation_angle0 = [0]
dilation_angle1 = [0]
min_viscosity = 1e24
