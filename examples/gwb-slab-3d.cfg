#############################################################################
# A 3D Geodynamic World Builder (GWB) world, gwb-slab-3d.wb (build with
# usegwb=1): a 200 x 100 x 100 km box with a continental plate (30 km crust)
# for x < 80 km, an oceanic plate (7 km crust) beyond, a slab dipping from the
# trench at x = 80 km, and a 10 km-thick plate-interface fault along its top
# to 60 km depth. In 3D the world needs no cross section: DES (x, y) are the
# world's map coordinates.
#
# temperature_option = 936: the world's temperature at each node;
# mattype_option = 936: GWB composition i is mattype i, and the world gives
# every point one (composition 2, the mantle, included);
# weakzone_option = 936: weakzone_plstrain in the elements inside the fault.
#
# It runs 5 kyr (about 6 s on 4 threads) to show the initial fields. Run
# longer and the dense slab sinks along the weak interface, at velocities far
# above the 3.15 cm/yr push, so the mesh remeshes often.
#############################################################################

[sim]
modelname = gwb-slab-3d
max_time_in_yr = 5e3
output_time_interval_in_yr = 1e3
has_output_during_remeshing = no
is_outputting_averaged_fields = no

[mesh]
meshing_option = 1
xlength = 200e3
ylength = 100e3
zlength = 100e3
resolution = 8e3
largest_size = 4
smallest_size = 0.04
quality_check_step_interval = 500
min_quality = 0.2
remeshing_option = 11

[control]
inertial_scaling = 1e4
# The initial stress and the boundary reference pressure: the lithostat of material
# mattype_ref (the mantle, below). ref_pressure_option = 1 (PREM) would start the mantle
# out of balance by a step at each 35 km row of the PREM table, a stripe in the strain rate.
ref_pressure_option = 0

[bc]
surface_temperature = 273
mantle_temperature = 1573      # the world's potential mantle temperature
vbc_x0 = 1                     # the x0 wall pushes at 1e-9 m/s (3.2 cm/yr)
vbc_x1 = 1
vbc_val_x0 = 1e-9
vbc_val_x1 = 0
# Front and back faces: free slip. Left free, they bulge outward: the plates and the slab
# weigh differently, and no one reference pressure holds them all.
vbc_y0 = 1
vbc_y1 = 1
vbc_val_y0 = 0
vbc_val_y1 = 0
has_water_loading = no

[ic]
# All three initial fields from the Geodynamic World Builder world (build with
# usegwb=1). In 3D DES's (x, y) are the world's map coordinates, so the world
# needs no cross section.
gwb_filename = gwb-slab-3d.wb  # relative to the directory DES runs in
temperature_option = 936       # each node's temperature from the world
mattype_option = 936           # each marker's material: GWB composition i is mattype i
weakzone_option = 936          # weakzone_plstrain in the elements inside the world's faults
weakzone_plstrain = 1

[mat]
rheology_type = elasto-visco-plastic
num_materials = 3              # 0 oceanic crust, 1 continental crust, 2 mantle
mattype_ref = 2                # the mantle: reference density for ref_pressure, dt and mass
rho0            = [ 2880,    2800,    3300   ]
alpha           = [ 3e-5 ]
bulk_modulus    = [ 50e9 ]
shear_modulus   = [ 30e9 ]
visc_exponent   = [ 3.05,    3.05,    3.00   ]
visc_coefficient = [ 1.25e-1, 1.25e-1, 7.00e4 ]
visc_activation_energy = [ 3.76e5, 2.76e5, 5.20e5 ]
heat_capacity   = [ 1000 ]
therm_cond      = [ 3.3 ]
pls0            = [ 0 ]
pls1            = [ 0.1 ]
cohesion0       = [ 4e7 ]
cohesion1       = [ 4e6 ]
friction_angle0 = [ 30 ]
friction_angle1 = [ 15 ]
dilation_angle0 = [ 0 ]
dilation_angle1 = [ 0 ]
max_viscosity = 1e24
min_viscosity = 1e19
