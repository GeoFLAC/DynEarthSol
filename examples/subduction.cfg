# ============================================================================
# Subduction phase changes: mat.phase_change_option = 3.
#
# A short oceanic slab sits in the trench at t = 0 (poly-subduction.poly): 7 km
# thick, dipping 30 deg to about 40 km depth, in a 400 km x 160 km domain. The
# left plate moves toward the fixed right plate at 3.15 cm/yr, with a 10x
# larger time step than the default (inertial_scaling in [control]): 5 Myr, a
# frame every 50 kyr, in about 22 min at 6 threads. Every 10
# steps the phase-change rules convert markers:
#   * mantle just above the slab top -> serpentinite (material 4), a weak and
#     light layer along the slab top and in the mantle-wedge corner, from the
#     first frame on;
#   * slab crust that crosses the basalt-eclogite boundary -> eclogite
#     (material 5), dense, so it adds slab pull at depth; few markers until
#     the slab tip sinks past about 60 km (about 1 Myr);
#   * serpentinite outside the antigorite stability field, above 550 C ->
#     mantle again.
# The rules measure depth from the current free surface, not from z = 0.
#
# Run from examples/ with a usemmg=1 build (remeshing_option 13 needs MMG):
#   OMP_NUM_THREADS=6 ../dynearthsol2d subduction.cfg
# ============================================================================

[sim]
modelname = model-subduction
max_time_in_yr = 5e6
output_time_interval_in_yr = 50e3
has_marker_output = yes

info_display_step_interval = 20000
# has_output_during_remeshing = yes

# checkpoint_frame_interval = 10
restarting_from_modelname = model-subduction
# is_restarting = yes
restarting_from_frame = 100  # the last checkpoint (5 Myr); raise max_time_in_yr to continue

[mesh]
meshing_option = 90
poly_filename = poly-subduction.poly

xlength = 400e3
ylength = 400e3
zlength = 160e3
resolution = 6e3            # times vt_size = serpentinization grid cell (see [mat])
#vt_size = 0.5
smallest_size = 0.04

quality_check_step_interval = 1000
min_quality = 0.2
# The restored side walls keep the layering of the plate that enters at x0.
remeshing_option = 13
is_discarding_internal_segments = yes
mmg_verbose = -1
mmg_hausd_factor = 0.1
max_boundary_distortion = 1
mmg_metric_refine_coeff = 5
mmg_remesh_defensive_quality_ratio = 1.5
mmg_aniso_wall_ratio = 2

[markers]
init_marker_option = 1
replenishment_option = 12   # a one-material element refills with its own material

[control]
ref_pressure_option = 1     # PREM: the reference lithostat (initial stress, Winkler base pressure)
surface_process_option = 1  # deposits become mattype_sediment
surface_diffusivity = 5e-7
# 1e4, not the default 1e5: the time step is the elastic limit
# 0.5 * min element height / (vbc * inertial_scaling), so it is 10x larger
# (core-complex-mmg.cfg uses the same): 0.87 yr on average here, 5.8 million
# steps for the 5 Myr. It buys speed, not accuracy.
inertial_scaling = 1e4

[bc]
surface_temperature = 273
mantle_temperature = 1573

# Convergence: the left plate moves inward, the right plate is a fixed backstop.
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = 1e-9     # +x, 3.15 cm/yr
vbc_val_x1 = 0
has_water_loading = no

[ic]
# Plastic weak zone along the slab top, a few km into the mantle wedge (+x):
# 30 deg down to 31 km depth. It seeds the plate interface. Centres and
# bounds are fractions of xlength and zlength; the half-width is in units
# of resolution.
weakzone_option = 5
weakzone_plstrain = 1
weakzone_num_segments = 1
weakzone_segments_inclination = [30]
weakzone_segments_azimuth     = [0]
weakzone_segments_halfwidth   = [0.6]
weakzone_segments_xcenter     = [0.42]
weakzone_segments_zcenter     = [0.135625]
weakzone_segments_depth_min   = [0.000]
weakzone_segments_depth_max   = [0.19375]
weakzone_segments_x_min       = [0.275]
weakzone_segments_x_max       = [0.575]

oceanic_plate_age_in_yr = 80e6   # half-space cooling (ic.temperature_option 0)

[mat]
rheology_type = elasto-visco-plastic
num_materials = 10
phase_change_option = 3

# A rule runs only when its switch is on and its source and target are
# distinct, valid materials. With these default switches, materials 6-9 stay
# empty here.
#has_serpentinization = yes
#has_eclogitization = yes
#has_hydrous_mantle_dehydration = no
#has_sediment_metamorphism = no

mattype_oceanic_crust = 0       # slab crust: crust for the serpentinization grid
mattype_continental_crust = 1   # not in the initial mesh
mattype_mantle = 2
mattype_sediment = 3            # also crust for the serpentinization grid
mattype_serpentinite = 4
mattype_eclogite = 5
mattype_hydrous_mantle = 6      # rule off
mattype_sediment_rock = 7       # rule off
mattype_metasediment = 8        # rule off
mattype_schist = 9              # rule off

# A mantle marker turns into serpentinite when it is in the antigorite
# stability field, at most 150 km deep, and a grid cell below it, within this
# distance (m), holds more than 50% crust (oceanic crust or sediment). The
# grid cell is mesh.resolution * mesh.vt_size = 3 km, so 5 km reaches one cell
# below the marker.
serpentinization_thickness = 5e3
#serpentinization_crust_margin = -1

# Rheology from the FLAC subduction material table: bulk and shear moduli from
# Lame constants lambda = mu = 3e10, plastic softening from 0 to 0.1. One column
# per material:
#                 [ ocean0    cont1     mant2    sed3      serp4     eclg5     hydm6     sedr7     meta8     sch9 ]
rho0            = [ 2880,     2800,     3300,    2400,     3200,     3480,     3200,     2600,     2800,     2900 ]
alpha           = [ 3e-5 ]
bulk_modulus    = [ 50e9 ]
shear_modulus   = [ 30e9 ]
visc_exponent   = [ 3.05,    3.05,     3.00,    3.00,     3.00,     3.05,     3.00,     3.00,     3.00,    3.00   ]
visc_coefficient = [ 1.25e-1, 1.25e-1, 7.00e4,  5.00e2,   7.00e4,   1.25e-1,  7.00e4,   5.00e2,   5.00e2,  7.00e4 ]
visc_activation_energy = [ 3.76e5,  2.76e5, 5.20e5, 2.00e5, 1.20e5,  4.50e5,  5.20e5,   2.00e5,   2.00e5,  3.76e5 ]
heat_capacity   = [ 1000 ]
therm_cond      = [ 3.3 ]
pls0            = [ 0 ]
pls1            = [ 0.1 ]
cohesion0       = [ 4e7,     4e7,      4e7,     4e6,      4e6,      4e7,      4e7,      4e7,      4e7,     4e7    ]
cohesion1       = [ 4e6,     4e6,      4e6,     4e6,      4e6,      4e6,      4e6,      4e6,      4e6,     4e6    ]
friction_angle0 = [ 30,      30,       30,      3,        3,        30,       30,       15,       30,      30     ]
friction_angle1 = [ 15,      15,       15,      3,        3,        15,       15,       3,        15,      15     ]
dilation_angle0 = [ 0 ]
dilation_angle1 = [ 0 ]

max_viscosity = 1e24
min_viscosity = 1e19
