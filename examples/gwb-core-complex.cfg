#############################################################################
# Core-complex example with the seed fault defined in gwb-core-complex.wb.
# Build with usegwb=1.
#############################################################################

[sim]
modelname = gwb-core-complex
#max_steps = 20000000
max_time_in_yr = 50000
output_time_interval_in_yr = 1500
# output_step_interval = 100

has_output_during_remeshing = no
is_outputting_averaged_fields = no

[mesh]
meshing_option = 2

xlength = 100e3
ylength = 10e3
zlength = 10e3
resolution = 1e3
largest_size = 10
smallest_size = 0.01

refined_zonex = [0.3, 0.7]
refined_zoney = [0.0, 1.0]
refined_zonez = [0.0, 1.0]

quality_check_step_interval = 500

remeshing_option = 1

[control]
surface_process_option = 1
surface_diffusivity = 1e-7

dt_fraction = 1.0
inertial_scaling = 1e5

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = -1e-9
vbc_val_x1 = 1e-9

vbc_y0 = 1
vbc_y1 = 1
vbc_val_y0 = 0
vbc_val_y1 = 0

has_water_loading = no

surface_temperature = 273
mantle_temperature = 273

[ic]
# Assign weakzone_plstrain to elements inside the world's fault features.
weakzone_option = 936
weakzone_plstrain = 0.5
gwb_filename = gwb-core-complex.wb

[mat]
rheology_type = elasto-plastic
rho0 = [2700]
alpha = [0]
bulk_modulus = [50e9]
shear_modulus = [30e9]
pls0 = [0]
pls1 = [0.5]
cohesion0 = [4.4e7]
cohesion1 = [4e6]
friction_angle0 = [30]
friction_angle1 = [30]

min_viscosity = 1e24

