# Short dry elastic compression, shared by dynearthsol2d and dynearthsol3d.
# Run from the repository root: OMP_NUM_THREADS=1 ./dynearthsol2d examples/pt-elastic-load.cfg
# Change PT_option to 1 to use adaptive dynamic relaxation on the same problem.
# Three physical steps on a fixed unit mesh; the applied top traction is -1e5 Pa.
[sim]
modelname = pt-elastic-load
max_steps = 3
info_display_step_interval = 1
output_step_interval = 1
checkpoint_frame_interval = 1
has_initial_checkpoint = yes
has_output_during_remeshing = no
is_outputting_averaged_fields = no

[mesh]
meshing_option = 1
xlength = 1
ylength = 1
zlength = 1
resolution = 0.5
remeshing_option = 0
quality_check_step_interval = 1

[control]
has_PT = yes
damping_option = 1
damping_factor = 0.3
PT_option = 0
PT_max_iter = 5000
PT_relative_tolerance = 1e-6
# Absolute force tolerance: N/m in 2D, N in 3D.
PT_absolute_tolerance = 1e-5
fixed_dt = 0.01
has_moving_mesh = no
has_hydraulic_diffusion = no
gravity = 0
surface_process_option = 0

[bc]
# Roller sides, clamped base, traction on the free top.
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = 0
vbc_val_x1 = 0
vbc_y0 = 1
vbc_y1 = 1
vbc_val_y0 = 0
vbc_val_y1 = 0
vbc_z0 = 3
vbc_val_z0 = 0
vbc_z1 = 0
stress_bc_z1 = 3
stress_val_z1 = -1e5
has_winkler_foundation = no
has_water_loading = no
surface_temperature = 273
mantle_temperature = 273

[ic]
has_body_force_adjustment = no
weakzone_option = 0

[mat]
rheology_type = elastic
rho0 = [2650]
porosity = [0]
bulk_modulus = [1e7]
shear_modulus = [1e7]
