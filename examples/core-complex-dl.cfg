[sim]
# core-complex.cfg with Duvaut-Lions regularization (tau = 3.3e8 s, eta/G for
# eta = 1e19 Pa s) and a mesh sized to the band width it sets, W ~ 1.15 km:
# elements of ~W/5 = 240 m where faults form, refinement stopped there.
# Main-fault width at 40-50 kyr: 1.32 km horizontal, within 2 % of fixed
# meshes refined over x = 30-70 km (250 m: 1.34 km, 167 m: 1.35 km), with about
# half the elements of the 167 m one. Faults that start outside the refined zone
# (x ~ 58-68 km in the fixed 167 m run) do not form here by 50 kyr: widen
# refined_zonex to cover them.
modelname = core-complex-dl
#max_steps = 20000000
max_time_in_yr = 50000
output_time_interval_in_yr = 1500
# output_step_interval = 100

has_output_during_remeshing = no
is_outputting_averaged_fields = no

[mesh]
meshing_option = 2

xlength = 100e3
ylength = 10e3
zlength = 10e3
# Fine size of the refined zone, which covers the weak zone and the main fault's
# path to the surface; ~570 m elsewhere (largest_size).
resolution = 166.667
largest_size = 19
# Refinement floor = sqrt(smallest_size) * mmg_remesh_defensive_tiny_ratio *
# resolution = sqrt(0.23) * 3 * 166.667 = 240 m ~ W/5.
smallest_size = 0.23
mmg_remesh_defensive_tiny_ratio = 3

refined_zonex = [0.41, 0.55]
refined_zoney = [0.0, 1.0]
refined_zonez = [0.0, 1.0]

quality_check_step_interval = 500

remeshing_option = 11
# Refines faults as plastic strain builds up; it acts only after a fault has
# started, so it does not replace the refined zone.
mmg_metric_refine_coeff = 100

[control]
has_duvaut_lions = yes
surface_process_option = 1
surface_diffusivity = 1e-7

dt_fraction = 1.0
inertial_scaling = 1e5

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = -1e-9
vbc_val_x1 = 1e-9

vbc_y0 = 1
vbc_y1 = 1
vbc_val_y0 = 0
vbc_val_y1 = 0

has_water_loading = no

surface_temperature = 273
mantle_temperature = 273

[ic]
weakzone_option = 1
weakzone_azimuth = 15
weakzone_inclination = -60
# Thin (250 m half-width, in units of resolution) and only partly softened
# (weakzone_plstrain < pls1), so the band width comes from tau, not the seed.
weakzone_halfwidth = 1.5
weakzone_depth_min = 0.5
weakzone_depth_max = 1.0
weakzone_xcenter = 0.5
weakzone_ycenter = 0.5
weakzone_zcenter = 0
weakzone_plstrain = 0.1

[mat]
relaxation_time = [3.333e8]
rheology_type = elasto-plastic
rho0 = [2700]
alpha = [0]
bulk_modulus = [50e9]
shear_modulus = [30e9]
pls0 = [0]
pls1 = [0.5]
cohesion0 = [4.4e7]
cohesion1 = [4e6]
friction_angle0 = [30]
friction_angle1 = [30]

min_viscosity = 1e24

