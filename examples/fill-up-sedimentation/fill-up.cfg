# Fill-up sedimentation in a 2D rift. See README.md in this directory.
# Run with:  ../../dynearthsol2d fill-up.cfg

[sim]
modelname = fill-up                 # output files start with this name
max_time_in_yr = 50000              # model time at which the run stops
output_time_interval_in_yr = 5000   # write a frame this often
has_marker_output = yes             # markers carry the material ids (needed to see the layers)

has_output_during_remeshing = no
is_outputting_averaged_fields = no

[mesh]
meshing_option = 2

# In 2D, xlength is the width and zlength the depth of the box (m); ylength is unused.
xlength = 100e3
ylength = 10e3
zlength = 10e3
resolution = 1e3                    # element size (m); smaller gives thinner visible layers but runs longer
largest_size = 10
smallest_size = 0.01

# finer elements in the middle 30-70 % of the width, where the rift opens
refined_zonex = [0.3, 0.7]
refined_zoney = [0.0, 1.0]
refined_zonez = [0.0, 1.0]

quality_check_step_interval = 500

remeshing_option = 1

[control]
# Sedimentation: wherever the surface drops below surf_base_level (m),
# it is raised back to that level and the space becomes sediment.
surface_process_option = 2
surf_base_level = 0
# Each sediment layer lasts this long (yr); the two sediment materials alternate.
sediment_layer_interval_in_yr = 5000

dt_fraction = 1.0
inertial_scaling = 1e5

[bc]
# Pull both sides apart at 1e-9 m/s (about 3 cm/yr each side).
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = -1e-9
vbc_val_x1 = 1e-9

vbc_y0 = 1
vbc_y1 = 1
vbc_val_y0 = 0
vbc_val_y1 = 0

has_water_loading = no

surface_temperature = 273
mantle_temperature = 273

[ic]
# A dipping weak zone in the middle of the box localizes the normal fault.
weakzone_option = 1
weakzone_azimuth = 15
weakzone_inclination = -60
weakzone_halfwidth = 1.2
weakzone_depth_min = 0.5
weakzone_depth_max = 1.0
weakzone_xcenter = 0.5
weakzone_ycenter = 0.5
weakzone_zcenter = 0
weakzone_plstrain = 0.5

[mat]
# Material 0 is the starting rock; 1 and 2 are the two sediment ids.
num_materials = 3
mattype_sediment = 1
mattype_sediment_alternate = 2

# One value in [ ] applies to all three materials, so the rock and both
# sediments have identical properties here. Give three values, e.g.
# rho0 = [2700, 2400, 2400], to make them differ.
rheology_type = elasto-plastic
rho0 = [2700]
alpha = [0]
bulk_modulus = [50e9]
shear_modulus = [30e9]
pls0 = [0]
pls1 = [0.5]
cohesion0 = [4.4e7]
cohesion1 = [4e6]
friction_angle0 = [30]
friction_angle1 = [30]

min_viscosity = 1e24
