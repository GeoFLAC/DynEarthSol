#############################################################################
# Accretionary (fold-and-thrust) wedge over a weak decollement, a small 2D
# version of Lee, Tan & Chang (2024), Front. Earth Sci. 12:1415139.
#
# A 3 km brittle layer over a 1 km decollement is pushed from the left wall
# at 5 cm/yr over a fixed base. The push tapers to 0 across the decollement
# (vbc_x0 = 3 with bottom_shear_zone_thickness), so the wall foot lags its
# top; remeshing_option = 12 puts the wall back to vertical at each remesh.
#
# Runs on a 2D build with or without MMG. As shipped it stops at 40 kyr
# (2 km of shortening), in under a minute on 4 threads, growing from 2778 to
# about 3300 (Triangle) or 3500 (MMG) elements; set
# max_time_in_yr = 200000 for the full run (a few minutes), in which thrusts
# break 7-8 and about 17 km from the wall. Basal friction is the second
# entry of friction_angle0/1: 1 degree here, try 5.
#############################################################################

[sim]
modelname = wedge
max_time_in_yr = 40000
output_time_interval_in_yr = 10000
has_output_during_remeshing = no
is_outputting_averaged_fields = no

[mesh]
meshing_option = 1
xlength = 40e3
ylength = 10e3
zlength = 4e3                       # 3 km layer + 1 km decollement
resolution = 250
largest_size = 4
smallest_size = 0.2                 # tiny-element trigger; also the floor of dt
quality_check_step_interval = 1000
min_quality = 0.3
remeshing_option = 12               # restore the pushing wall (x0) to vertical

[control]
surface_process_option = 1
surface_diffusivity = 1e-6
inertial_scaling = 3e3

[bc]
# Left wall: pushes at 5 cm/yr, vertical velocity fixed at 0; the push
# tapers linearly to 0 across the lowest 1 km (the decollement).
vbc_x0 = 3
vbc_val_x0 = 1.5844e-9
bottom_shear_zone_thickness = 1e3   # in m
# Right wall: free slip. Base: no slip.
vbc_x1 = 1
vbc_val_x1 = 0
vbc_z0 = 3
vbc_val_z0 = 0
has_winkler_foundation = no
has_water_loading = no
surface_temperature = 273
mantle_temperature = 273

[ic]
mattype_option = 1
num_mattype_layers = 2
layer_mattypes = [0, 1]             # 0: brittle layer, 1: decollement
mattype_layer_depths = [0.75]       # decollement top at 3 km depth
weakzone_option = 0

[mat]
rheology_type = elasto-plastic
num_materials = 2
rho0 = [2600, 2600]
alpha = [0, 0]
bulk_modulus = [50e9, 50e9]
shear_modulus = [30e9, 30e9]
pls0 = [0, 0]
pls1 = [0.1, 0.1]
cohesion0 = [4e6, 4e6]
cohesion1 = [4e5, 4e5]
friction_angle0 = [30, 1]           # basal friction 1 degree
friction_angle1 = [15, 1]
dilation_angle0 = [0, 0]
dilation_angle1 = [0, 0]
min_viscosity = 1e24
