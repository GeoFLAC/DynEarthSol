# phase_change_option 3 with has_serpentinization: a mantle marker in the antigorite
# stability field, at most serpentinization_max_depth deep, turns into serpentinite when a
# cell below it within this distance (m) is wet-crust-dominant: more than
# wet_crust_fraction_threshold of its markers is wet crust, the water-bearing slab material
# (mattype_oceanic_crust, mattype_sediment, and mattype_sediment_rock when set; NOT
# continental crust, eclogite, metasediment or schist). Counted in whole virtual-topology
# cells, so it must be >= mesh.resolution * mesh.vt_size (one cell). Heuristic, untuned.
#serpentinization_thickness = 10e3
# phase_change_option 3: >= 0 (m) = such a cell counts only if the marker's horizontal
# position lies within that cell's wet-crust extent widened by this margin. This
# suppresses the false positive at a slab bend (a cell wet-crust-dominant from wet crust
# up to a cell width away). < 0 = off: the whole cell column counts.
#serpentinization_wet_crust_margin = -1
