#############################################################################
# This is an input file for 2D/3D DynEarthSol. All available input parameters
# are listed here. Parameters with default values are commented out with
# the default values. Parameters that are not commented out are required.
#
# Parameters starting with 'is_' or 'has_' are boolean. Acceptable values
# include: yes, no, on, off, 1, 0.
#
# Parameters of multiple values must be quoted by [].
#
# Use command lne argument '--help' to see more description.
#############################################################################

[sim]
modelname = result

### Condition for end of simulation
max_steps = 1000
max_time_in_yr = 3000

### Condition for output
output_step_interval = 200
output_time_interval_in_yr = 100

#info_display_step_interval = 10000
### the .manifest sections on screen at run start
#has_runtime_info_display = yes

#checkpoint_frame_interval = 10
#is_restarting = no
#restarting_from_modelname = result
#restarting_from_frame = 0

#has_initial_checkpoint = yes
#has_marker_output = yes
#has_output_during_remeshing = no
#is_outputting_averaged_fields = yes
#hdf5_compression_level = 4

#earthquake_output_step_interval = 50
#earthquake_start_factor = 5.0
#earthquake_end_factor = 2.0
#seismic_moment_calculate_output = no

[mesh]
### How to create the new mesh?
#meshing_option = 1
#meshing_elem_shape = 0
#meshing_verbosity = -1
#meshing_sediment = no
#tetgen_optlevel = 3

### Dimension of the box (in meters)
xlength = 130e3
ylength = 100e3
zlength = 100e3
resolution = 30e3
### smallest_size / largest_size: element sizes as relative element volumes (volume = size *
### sizefactor * resolution^NDIMS); --help lists the remesh lengths and MMG sizes they set.
#smallest_size = 0.01
#largest_size = 30
#sediment_size = 1.

### For 2d mesh quality
#min_angle = 32.
### Cap on Triangle Steiner points as a multiple of the input node count (2d only).
### Bounds the non-terminating segment splitting Triangle can enter on a highly
### distorted mesh (two boundary segments at a tiny angle). <= 0 disables the cap.
#max_steiner_factor = 30.
### For 3d mesh quality
#min_tet_angle = 22.
#max_ratio = 2.0

### For meshing_option = 2
#refined_zonex = [0.4, 0.6]
#refined_zoney = [0.4, 0.6]
#refined_zonez = [0.8, 1.0]

### For meshing_option = 90 or 91
#poly_filename = mesh.poly
### For meshing_option = 95
#exo_filename = mesh.exo

#quality_check_step_interval = 100
#min_quality = 0.4
#max_boundary_distortion = 0.25

#remeshing_option = 0
#is_discarding_internal_segments = yes

### Every mmg_* key is inert in a non-MMG build.
### The next four keys set what conservative MMG remeshing refines, repairs and recovers (--help).
#mmg_remesh_active_plstrain = 0.01

#mmg_remesh_defensive_quality_ratio = 1.5

#mmg_remesh_size_recovery_ratio = 1.4

#mmg_remesh_defensive_tiny_ratio = 1.5

### Deborah-number-weighted stress remap: blend the NN-remapped stress (preserves
### elastic stress memory in cold/stiff regions) with the SPR-recovered stress
### (smooths noise in weak/viscous regions) per element, by
### De = (viscosity / shear modulus) / (time since last remesh). The weight is a
### smoothstep (the cubic 3t^2 - 2t^3, flat at both ends) in log10(De) between them.
### De = 1 is where the Maxwell time equals the remesh interval; the defaults put
### the pure-SPR and pure-NN limits two decades apart, clear of that crossover.
#remesh_deborah_min = 1     # De <= min: pure SPR
#remesh_deborah_max = 100   # De >= max: pure NN

#mmg_debug = 0
#mmg_verbose = 0

### mmg_hmin_factor / mmg_hmax_factor are retired: smallest_size = hmin_factor^NDIMS /
### mmg_remesh_defensive_tiny_ratio and largest_size = hmax_factor^NDIMS give the same MMG band.
### The old defaults, [0.2, 2.0] * resolution, are smallest_size = 0.0267, largest_size = 4 (2D)
### or 0.00533, 8 (3D) at the default ratio 1.5 (the new defaults give [0.12, 5.5] in 2D,
### [0.25, 3.1] in 3D). Converting also changes the other sizes these two keys set (see --help).

#mmg_metric_refine_coeff = 5.0

#mmg_metric_refine_recover = no

#mmg_aniso_wall_ratio = 0

### A sharply bent free surface can need a larger mmg_hausd_factor (see --help).
#mmg_hausd_factor = 0.01

#use_mmg_init = no
#mmg_init_coarsening_factor = 10.0

# Virtual-topology grid cell (x mesh.resolution) for the serpentinization grid
# (phase_change_option 3 with has_serpentinization).
# 0.5 = half an element: resolves the slab's wet-crust layer. Nominally (elements of edge
# mesh.resolution, 4 markers per element) a cell holds ~2.3 markers in 2D and
# ~4.2 in 3D; a refined mesh puts more in each cell. Untuned. The grid is rebuilt
# at each mesh.quality_check_step_interval and after each remesh.
#vt_size = 0.5

