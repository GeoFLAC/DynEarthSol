[sim]
modelname = ccmmg
#max_steps = 20000000
max_time_in_yr = 500000
output_time_interval_in_yr = 10000
#output_step_interval = 100000000

has_output_during_remeshing = no
is_outputting_averaged_fields = no

checkpoint_frame_interval = 5
#is_restarting = yes
#restarting_from_modelname = result2
#restarting_from_frame = 120

[mesh]
meshing_option = 2

xlength = 100e3
ylength = 10e3
zlength = 10e3
resolution = 1e3
# smallest_size: tiny-element trigger (all remeshers) and the other remesh sizes its --help lists;
# MMG hmin = 0.245*resolution (2D) at the default mmg_remesh_defensive_tiny_ratio 1.5.
# To let MMG build smaller elements, decrease; the tiny-element trigger drops by the same factor.
# largest_size: MMG hmax = 2*resolution (2D) and the coarse zone of the refined-zone initial mesh.
# To mesh the coarse zone coarser, increase; remeshes never coarsen quiet regions past the
# initial mesh.
largest_size = 4
smallest_size = 0.04

refined_zonex = [0.3, 0.7]
refined_zoney = [0.0, 1.0]
refined_zonez = [0.0, 1.0]

quality_check_step_interval = 2000
min_quality = 0.2
max_boundary_distortion = 0.2

# To also restore the side walls and give inflow material a recorded profile, set 13 (needs MMG).
# MMG then refines the walls to ~resolution at t = 0 and caps their size target there each remesh.
remeshing_option = 11

### Conservative MMG remeshing is always on with MMG; these four tune what it freezes, repairs
### and recovers (see --help for the exact rule each feeds).
# To freeze more of the yielding band as quiet (fewer elements split each remesh), increase; keep
# it > 0: at 0, incidental yielding makes quiet far-field elements splittable.
#mmg_remesh_active_plstrain = 0.01
# To repair a marginal-quality element now instead of letting it cross min_quality and trigger
# another remesh a few steps later, increase (more elements are re-interpolated); minimum 1
# (1: repair only below min_quality).
#mmg_remesh_defensive_quality_ratio = 1.5
# To widen MMG's gap above the tiny-element trigger (fewer back-to-back remeshes),
# increase; minimum 1. MMG's size floors rise with it, so its finest elements get coarser.
#mmg_remesh_defensive_tiny_ratio = 1.5
# To let a fossil-fine element (e.g. one that entered through a restored inflow wall) coarsen back
# sooner, decrease (keep > 1). 0 turns off size recovery (also its split of an element 2x its
# target) AND the t = 0 weak-zone refinement; nothing then frees a quiet element for its size.
#mmg_remesh_size_recovery_ratio = 1.4

### These two shape the plastic-strain-driven refinement metric.
# To localize the shear band narrower (more elements, usually a shorter dt), increase; 0 disables
# plastic-strain refinement from a fresh start.
#mmg_metric_refine_coeff = 5.0
# To let a refined zone coarsen back as plastic strain drops instead of keeping the finest size
# target it had at a remesh, set yes (the coarsening goes through size recovery).
#mmg_metric_refine_recover = no

# To carry an inflow wall's incoming column on fewer, wider elements normal to the wall instead of
# isotropically, set an aspect ratio >= 1 (0 = off). remeshing_option 13 only, at a receiving wall;
# MMG's hmax caps the aspect.
#mmg_aniso_wall_ratio = 0

### The two-stage Triangle/TetGen+MMG initial mesh. Either way, MMG refines the weak zone at t = 0
### (moving mesh, mmg_remesh_size_recovery_ratio > 0) and, under remeshing_option 13, the walls.
# To refine the initial mesh with MMG's own metric instead of plain Triangle/TetGen, set yes.
#use_mmg_init = no
# To see what each remesh re-sized, collapsed, froze, freed and restored, set 0 (default -1).
#meshing_verbosity = -1
# With use_mmg_init = yes: to speed up the coarse Triangle (2D) / TetGen (3D) first stage (leaving
# MMG more refining to do after), increase; for a finer first stage, decrease.
#mmg_init_coarsening_factor = 10.0

mmg_debug = 0
mmg_verbose = 5
# To stop MMG refining a sharply bent free surface below the tiny-element trigger (a remesh at
# nearly every quality check), increase: 0.02-0.05 along a 3D fault scarp, 0.1 on the top/wall
# ridges next to restored side walls (option 13). A larger value lets the surface depart further.
mmg_hausd_factor = 0.01

[control]
surface_process_option = 1
surface_diffusivity = 1e-6

dt_fraction = 1.0
inertial_scaling = 1e4

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = -1e-9
vbc_val_x1 = 1e-9

vbc_y0 = 1
vbc_y1 = 1
vbc_val_y0 = 0
vbc_val_y1 = 0

has_water_loading = no

surface_temperature = 273
mantle_temperature = 273

[ic]
weakzone_option = 1
weakzone_azimuth = 15
weakzone_inclination = -60
weakzone_halfwidth = 1.2
weakzone_depth_min = 0.5
weakzone_depth_max = 1.0
weakzone_xcenter = 0.5
weakzone_ycenter = 0.5
weakzone_zcenter = 0
weakzone_plstrain = 0.5

[mat]
rheology_type = elasto-plastic
rho0 = [2700]
alpha = [0]
bulk_modulus = [50e9]
shear_modulus = [30e9]
pls0 = [0]
pls1 = [0.5]
cohesion0 = [4.4e7]
cohesion1 = [4e6]
friction_angle0 = [30]
friction_angle1 = [30]

min_viscosity = 1e24

