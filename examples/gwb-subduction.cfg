#############################################################################
# Initial conditions from a Geodynamic World Builder (GWB) world: build with
# usegwb=1 (see README.md). gwb-subduction.wb is a 600 x 200 km cross section
# of a continental plate (35 km crust), an oceanic plate (7 km crust) and a
# slab descending from x = 250 km to about 180 km depth, with GWB's plate and
# mass-conserving slab temperatures, and a 6 km-thick fault along the slab top
# to 80 km depth, the plate interface.
#
# ic.temperature_option = 936 sets the nodal temperature from the world and
# ic.mattype_option = 936 the material of each marker: GWB composition i is
# mattype i, so the world numbers its compositions in the [mat] order here
# (0 oceanic crust, 1 continental crust, 2 mantle), and must give every
# point one; a marker where no composition reaches 0.5 stops the run.
# ic.weakzone_option = 936 gives the elements in the world's fault features
# weakzone_plstrain. GWB is queried only at initialization; a restart reads
# the saved fields.
#
# The walls are fixed: this example shows the initial fields, not subduction.
#############################################################################

[sim]
modelname = gwb-subduction
max_time_in_yr = 100e3
output_time_interval_in_yr = 20e3
has_output_during_remeshing = no
is_outputting_averaged_fields = no

[mesh]
meshing_option = 1
xlength = 600e3
ylength = 100e3                # unused in 2D
zlength = 200e3
resolution = 5e3
largest_size = 4
smallest_size = 0.04
quality_check_step_interval = 500
min_quality = 0.2
remeshing_option = 11

[control]
inertial_scaling = 1e4
ref_pressure_option = 1

[bc]
surface_temperature = 273
mantle_temperature = 1573      # the world's potential mantle temperature
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = 0
vbc_val_x1 = 0
has_water_loading = no

[ic]
temperature_option = 936
mattype_option = 936
gwb_filename = gwb-subduction.wb
weakzone_option = 936
weakzone_plstrain = 1

[mat]
rheology_type = elasto-visco-plastic
num_materials = 3              # 0 oceanic crust, 1 continental crust, 2 mantle
rho0            = [ 2880,    2800,    3300   ]
alpha           = [ 3e-5 ]
bulk_modulus    = [ 50e9 ]
shear_modulus   = [ 30e9 ]
visc_exponent   = [ 3.05,    3.05,    3.00   ]
visc_coefficient = [ 1.25e-1, 1.25e-1, 7.00e4 ]
visc_activation_energy = [ 3.76e5, 2.76e5, 5.20e5 ]
heat_capacity   = [ 1000 ]
therm_cond      = [ 3.3 ]
pls0            = [ 0 ]
pls1            = [ 0.1 ]
cohesion0       = [ 4e7 ]
cohesion1       = [ 4e6 ]
friction_angle0 = [ 30 ]
friction_angle1 = [ 15 ]
dilation_angle0 = [ 0 ]
dilation_angle1 = [ 0 ]
max_viscosity = 1e24
min_viscosity = 1e19
