# Focused monitor-CSV restart regression using public options only.
#
# A fresh run writes steps 0--4 and checkpoints at steps 0, 2 and 4. The
# restart tests resume frame 1 (step 2) with the same monitor prefix, so rows
# 3--4 are a stale suffix that must be replaced without losing rows 0--2.

[sim]
modelname = monitor_restart
max_steps = 4
output_step_interval = 2
checkpoint_frame_interval = 1
has_initial_checkpoint = yes
has_marker_output = yes
is_outputting_averaged_fields = no
is_restarting = __IS_RESTARTING__
restarting_from_modelname = monitor_restart
restarting_from_frame = __RESTART_FRAME__

[mesh]
meshing_option = 1
xlength = 1
ylength = 1
zlength = 1
resolution = 0.25
quality_check_step_interval = 1000
remeshing_option = 0

[control]
gravity = 0
fixed_dt = 1
inertial_scaling = 1.0e5
damping_option = 2
damping_factor = 1
surface_process_option = 0
has_moving_mesh = no
use_global_velocity_scaling = no
is_using_mixed_stress = no
has_PT = no
has_thermal_diffusion = no
has_hydraulic_diffusion = no

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = 0
vbc_val_x1 = 0
vbc_z0 = 1
vbc_z1 = 1
vbc_val_z0 = 0
vbc_val_z1 = 0
has_winkler_foundation = no
has_water_loading = no

[ic]
weakzone_option = 0
temperature_option = 0

[mat]
rheology_type = elastic
is_plane_strain = yes
num_materials = 1
rho0 = [1]
alpha = [0]
bulk_modulus = [2.0e8]
shear_modulus = [2.0e8]

[monitor]
enabled = yes
output_prefix = monitor_history
step_interval = 1
num_points = 2
points_x = [0.25, 0.75]
points_z = [-0.25, -0.75]
points_unit = m
remesh_rebind_mode = initial_coord
write_header = __WRITE_HEADER__
output_coord = yes
output_velocity = yes
