[sim]
modelname = __MODELNAME__
max_steps = __MAX_STEPS__
output_step_interval = 1
checkpoint_frame_interval = 1
has_initial_checkpoint = yes
has_marker_output = yes
has_output_during_remeshing = no
is_outputting_averaged_fields = no
is_restarting = __IS_RESTARTING__
restarting_from_modelname = __RESTART_MODEL__
restarting_from_frame = __RESTART_FRAME__

[mesh]
meshing_option = 1
xlength = 1
ylength = 1
zlength = 1
resolution = 0.5
quality_check_step_interval = 1000
remeshing_option = 0

[control]
gravity = 10
fixed_dt = 1e-6
inertial_scaling = 1e8
ref_pressure_option = __REF_PRESSURE_OPTION__
surf_base_level = __SURF_BASE_LEVEL__
is_quasi_static = no
damping_option = 1
damping_factor = 0
surface_process_option = 0
has_moving_mesh = no
has_PT = no
has_thermal_diffusion = no
has_hydraulic_diffusion = __HYDRAULIC__
has_poroelastic_pressure_feedback = no

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = 0
vbc_val_x1 = 0
vbc_y0 = 1
vbc_y1 = 1
vbc_val_y0 = 0
vbc_val_y1 = 0
vbc_z0 = 1
vbc_z1 = 0
vbc_val_z0 = 0
vbc_val_z1 = 0
stress_bc_z1 = __STRESS_BC_Z1__
stress_val_z1 = __STRESS_VAL_Z1__
has_winkler_foundation = no
has_water_loading = __WATER_LOADING__
sea_water_density = __SEA_WATER_DENSITY__
surface_temperature = 273
mantle_temperature = 273
hbc_x0 = 0
hbc_x1 = 0
hbc_y0 = 0
hbc_y1 = 0
hbc_z0 = 0
hbc_z1 = 0

[ic]
weakzone_option = 0
temperature_option = 0
excess_pore_pressure = 0
has_body_force_adjustment = no

[mat]
rheology_type = elastic
is_plane_strain = no
num_materials = __NUM_MATERIALS__
mattype_ref = 0
rho0 = [2000]
alpha = [0]
bulk_modulus = [1e9]
shear_modulus = [1e9]
porosity = [__POROSITY__]
hydraulic_perm = [1e-18]
fluid_rho0 = [__FLUID_DENSITY__]
fluid_alpha = [2e-4]
fluid_bulk_modulus = [2e9]
fluid_visc = [1e-3]
biot_coeff = [1]
bulk_modulus_s = [1e10]

[monitor]
enabled = no
