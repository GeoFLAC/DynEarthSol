[sim]
modelname = __MODELNAME__
max_steps = 2
output_step_interval = 2
checkpoint_frame_interval = 1
has_initial_checkpoint = yes
has_marker_output = no
has_output_during_remeshing = yes
is_outputting_averaged_fields = no

[mesh]
meshing_option = 90
poly_filename = boundary_remesh.poly
xlength = 1
ylength = 1
zlength = 1
resolution = 1
min_angle = 0
quality_check_step_interval = 1
min_quality = 0.999999
remeshing_option = 10
smallest_size = 0.001

[control]
gravity = 0
fixed_dt = 0.1
inertial_scaling = 1.0e5
is_quasi_static = no
surface_process_option = 0
has_moving_mesh = yes
use_global_velocity_scaling = no
damping_option = 2
damping_factor = 0.1
has_thermal_diffusion = no
has_hydraulic_diffusion = no

[bc]
vbc_x0 = 0
vbc_x1 = 0
vbc_y0 = 0
vbc_y1 = 0
vbc_z0 = 0
vbc_z1 = 1
vbc_val_z1 = 2.0
vbc_val_z1_loading_period = 0.15
vbc_n0 = 1
vbc_val_n0 = 0
has_winkler_foundation = no
has_water_loading = no

[ic]
weakzone_option = 0

[mat]
rheology_type = elastic
is_plane_strain = yes
num_materials = 1
rho0 = [1.0e12]
alpha = [0]
bulk_modulus = [2.0e8]
shear_modulus = [2.0e8]
heat_capacity = [1.0e3]
therm_cond = [1.0e-12]
