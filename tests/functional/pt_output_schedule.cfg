# Quiescent clamped RSF cell: isolate output scheduling from mechanical convergence.
# Shared by 2D/3D; the test runner selects the output cadence.
[sim]
checkpoint_frame_interval = 1
has_initial_checkpoint = yes
modelname = shared
max_steps = 1
output_step_interval = 1
max_time_in_yr = 0.000063857
output_time_interval_in_yr = 1
has_output_during_remeshing = no
is_outputting_averaged_fields = no

[mesh]
meshing_option = 1
xlength = 1
ylength = 1
zlength = 1
resolution = 1
largest_size = 1
smallest_size = 1
refined_zonex = [0.0, 1.0]
refined_zoney = [0.0, 1.0]
refined_zonez = [0.0, 1.0]
remeshing_option = 0

[control]
surface_process_option = 0
surface_diffusivity = 1e-7
damping_option = 1
damping_factor = 0.3
is_quasi_static = yes
inertial_scaling = 1e11
has_hydraulic_diffusion = false
has_PT = true
PT_max_iter = 5000
PT_relative_tolerance = 1e-6
has_moving_mesh = false
gravity = 0
fixed_dt = 0.01
rsf_slip_rate_projection_option = 1

[bc]
vbc_x0 = 3
vbc_x1 = 3
vbc_val_x0 = 0
vbc_val_x1 = 0
vbc_y0 = 3
vbc_y1 = 3
vbc_val_y0 = 0
vbc_val_y1 = 0
vbc_z0 = 3
vbc_z1 = 3
vbc_val_z0 = 0
vbc_val_z1 = 0
has_winkler_foundation = no
has_water_loading = no
surface_temperature = 273
mantle_temperature = 273
hbc_x0 = 0
hbc_x1 = 1
hbc_y0 = 0
hbc_y1 = 0
hbc_z0 = 0
hbc_z1 = 0
stress_bc_z1 = 0
stress_val_z1 = -1e5

[ic]
weakzone_option = 1
has_body_force_adjustment = false

[mat]
rheology_type = elasto-plastic-rsf
rho0 = [2650]
bulk_modulus = [1e7]
shear_modulus = [1e7]
porosity = [0.3]
hydraulic_perm = [1.03e-12]
fluid_rho0 = [1000]
fluid_alpha = [2.07e-4]
fluid_bulk_modulus = [2.17e9]
fluid_visc = [1.002e-3]
biot_coeff = [1.0]
bulk_modulus_s = [37e9]
min_viscosity = 1e7
max_viscosity = 1e7
state_var_model = 1
characteristic_distance = [1]
characteristic_velocity = [0.01]
direct_a = [0.01]
evolution_b = [0.015]
friction_angle0 = [30]
friction_angle1 = [30]
cohesion0 = [1e6]
cohesion1 = [1e6]
dilation_angle0 = [0]
dilation_angle1 = [0]

