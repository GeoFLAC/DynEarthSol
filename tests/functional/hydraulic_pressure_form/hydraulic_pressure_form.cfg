# Focused regression for pressure-form hydraulic diffusion.

[sim]
modelname = __MODELNAME__
max_steps = 2
output_step_interval = 1
checkpoint_frame_interval = 1000
has_initial_checkpoint = no
has_marker_output = no
has_output_during_remeshing = no
is_outputting_averaged_fields = no

[mesh]
meshing_option = 1
meshing_elem_shape = 1
xlength = 1
ylength = 1
zlength = 1
resolution = 0.25
quality_check_step_interval = 1
remeshing_option = 0

[control]
gravity = __GRAVITY__
fixed_dt = 1e-4
inertial_scaling = 1e13
ref_pressure_option = 0
surf_base_level = 0
is_quasi_static = no
surface_process_option = 0
damping_option = 1
damping_factor = 0.3
has_moving_mesh = no
has_PT = no
has_thermal_diffusion = no
has_hydraulic_diffusion = yes
has_poroelastic_pressure_feedback = no

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = 0
vbc_val_x1 = 0
vbc_y0 = 1
vbc_y1 = 1
vbc_val_y0 = 0
vbc_val_y1 = 0
vbc_z0 = 1
vbc_z1 = 1
vbc_val_z0 = 0
vbc_val_z1 = 0
hbc_x0 = 0
hbc_x1 = 0
hbc_y0 = 0
hbc_y1 = 0
hbc_z0 = 0
hbc_z1 = 0
has_winkler_foundation = no
has_water_loading = no

[ic]
weakzone_option = 0
temperature_option = 0
excess_pore_pressure = 0

[mat]
rheology_type = elastic
is_plane_strain = __PLANE_STRAIN__
num_materials = 1
rho0 = [1]
alpha = [0]
bulk_modulus = [1e9]
shear_modulus = [1e9]
heat_capacity = [1e3]
therm_cond = [1e-12]
porosity = [0.2]
hydraulic_perm = [1e-12]
fluid_rho0 = [850]
fluid_alpha = [2e-4]
fluid_bulk_modulus = [2e9]
fluid_visc = [1e-3]
biot_coeff = [1]
bulk_modulus_s = [37e9]

__SOURCE_SECTION__
