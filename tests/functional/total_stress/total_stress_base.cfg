# Zero-strain pore-pressure bridge regression. The runner creates a frame-0
# checkpoint, changes p_new and p_old-p_new in that checkpoint, then restarts
# for one constitutive update with every velocity boundary fixed.

[sim]
modelname = __MODELNAME__
max_steps = 1
output_step_interval = 1
checkpoint_frame_interval = 1
has_initial_checkpoint = __HAS_INITIAL_CHECKPOINT__
is_restarting = __IS_RESTARTING__
restarting_from_modelname = __RESTART_MODEL__
restarting_from_frame = 0
has_marker_output = yes
has_output_during_remeshing = no
is_outputting_averaged_fields = no

[mesh]
xlength = 1
ylength = 1
zlength = 1
resolution = 0.5
quality_check_step_interval = 1000
remeshing_option = 0

[control]
gravity = 0
fixed_dt = 1
inertial_scaling = 1e5
is_quasi_static = no
damping_option = 1
damping_factor = 0.3
surface_process_option = 0
has_moving_mesh = no
use_global_velocity_scaling = no
is_using_mixed_stress = no
has_PT = __HAS_PT__
PT_max_iter = 2
has_thermal_diffusion = no
has_hydraulic_diffusion = no
__EFFECTIVE_STRESS_OPTION__
has_poroelastic_pressure_feedback = no

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_y0 = 1
vbc_y1 = 1
vbc_z0 = 1
vbc_z1 = 1
vbc_val_x0 = 0
vbc_val_x1 = 0
vbc_val_y0 = 0
vbc_val_y1 = 0
vbc_val_z0 = 0
vbc_val_z1 = 0
has_winkler_foundation = no
has_elastic_foundation = no
has_water_loading = no

[ic]
weakzone_option = 0
temperature_option = 0

[mat]
rheology_type = elastic
is_plane_strain = __PLANE_STRAIN__
num_materials = 1
rho0 = [1]
alpha = [0]
bulk_modulus = [2e8]
shear_modulus = [2e8]
heat_capacity = [1e3]
therm_cond = [1e-12]
porosity = [0.2]
fluid_rho0 = [1000]
fluid_bulk_modulus = [2.17e9]
derive_biot_coeff_from_bulk_moduli = no
biot_coeff = [0.25]
bulk_modulus_s = [37e9]

[monitor]
enabled = no
