[sim]
modelname = __MODELNAME__
max_steps = 1
output_step_interval = 1000
has_initial_checkpoint = no
has_marker_output = no
has_output_during_remeshing = no
is_outputting_averaged_fields = no

[mesh]
xlength = 1
ylength = 1
zlength = 1
resolution = 0.25
quality_check_step_interval = 1000
remeshing_option = 0

[control]
gravity = 0
characteristic_speed = 1.0e-12
inertial_scaling = 1.0e15
fixed_dt = 0
dt_fraction = 1
is_quasi_static = __QUASI_STATIC__
use_global_velocity_scaling = no
surface_process_option = 0
damping_option = 1
has_PT = no
has_moving_mesh = __MOVING_MESH__
has_thermal_diffusion = no
has_hydraulic_diffusion = __HYDRAULIC_ENABLED__
has_poroelastic_pressure_feedback = no
has_pore_pressure_effective_stress = no
has_hydration_processes = no

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = 0
vbc_val_x1 = 0
vbc_y0 = 1
vbc_y1 = 1
vbc_val_y0 = 0
vbc_val_y1 = 0
vbc_z0 = 1
vbc_z1 = 1
vbc_val_z0 = 0
vbc_val_z1 = 0
hbc_x0 = 0
hbc_x1 = 0
hbc_y0 = 0
hbc_y1 = 0
hbc_z0 = 0
hbc_z1 = 0
has_winkler_foundation = no
has_water_loading = no

[ic]
mattype_option = 1
num_mattype_layers = 2
layer_mattypes = [__LAYER_MATTYPES__]
mattype_layer_depths = [0.5]
weakzone_option = 0
temperature_option = 0

[mat]
rheology_type = elastic
is_plane_strain = yes
num_materials = 2
mattype_ref = 1

rho0 = [1.0e9]
bulk_modulus = [1]
shear_modulus = [1]
heat_capacity = [1.0e3]
therm_cond = [1.0e-12]

porosity = [0.2]
hydraulic_perm = [__PERM0__, __PERM1__]
fluid_rho0 = [1.0e3]
fluid_alpha = [0]
fluid_bulk_modulus = [1.0e10]
fluid_visc = [1]
biot_coeff = [1]
bulk_modulus_s = [1.0e10]

[debug]
dt = yes
