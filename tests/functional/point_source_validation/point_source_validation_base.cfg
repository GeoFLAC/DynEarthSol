[sim]
modelname = __MODELNAME__
max_steps = 1
output_step_interval = 1000
checkpoint_frame_interval = 1
has_initial_checkpoint = no
has_marker_output = no
has_output_during_remeshing = no
is_outputting_averaged_fields = no

[mesh]
meshing_option = __MESHING_OPTION__
poly_filename = mesh.poly
xlength = 1
ylength = 1
zlength = 1
resolution = 0.25
quality_check_step_interval = 1000
remeshing_option = 0

[control]
# The public hydraulic update expresses head through gamma_w, so this focused
# source check uses finite nonzero gravity.
gravity = 10
fixed_dt = __FIXED_DT__
inertial_scaling = 1e9
is_quasi_static = no
surface_process_option = 0
damping_option = 1
damping_factor = 0.3
has_PT = __HAS_PT__
has_moving_mesh = __HAS_MOVING_MESH__
has_thermal_diffusion = no
has_hydraulic_diffusion = yes

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = 0
vbc_val_x1 = 0
vbc_y0 = 1
vbc_y1 = 1
vbc_val_y0 = 0
vbc_val_y1 = 0
vbc_z0 = 1
vbc_z1 = 1
vbc_val_z0 = 0
vbc_val_z1 = 0
hbc_x0 = 0
hbc_x1 = __HBC_X1__
hbc_y0 = 0
hbc_y1 = 0
hbc_z0 = 0
hbc_z1 = 0
has_winkler_foundation = no
has_water_loading = no

[ic]
weakzone_option = 0
temperature_option = 0

[mat]
rheology_type = elastic
is_plane_strain = yes
num_materials = 1
rho0 = [1]
alpha = [0]
bulk_modulus = [1e9]
shear_modulus = [1e9]
heat_capacity = [1e3]
therm_cond = [1e-12]
porosity = [__POROSITY__]
hydraulic_perm = [__PERMEABILITY__]
fluid_rho0 = [1e3]
fluid_alpha = [0]
fluid_bulk_modulus = [__FLUID_BULK_MODULUS__]
fluid_visc = [1e-3]
biot_coeff = [__BIOT_COEFF__]
bulk_modulus_s = [37e9]

__SOURCE_SECTION__
