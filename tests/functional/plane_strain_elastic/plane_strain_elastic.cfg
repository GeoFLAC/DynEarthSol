# Focused feature-off regression for 2-D plane-strain elastic stress.
#
# The top boundary shortens the fixed-width box for two physical steps.  With
# epsilon_yy = 0, isotropic elasticity requires
#   delta sigma_yy = lambda * (delta epsilon_xx + delta epsilon_zz),
# where lambda = K - 2G/3.  All coupled physics, PT, and mesh motion are off.

[sim]
modelname = __MODELNAME__
max_steps = 2
output_step_interval = 2
checkpoint_frame_interval = 1
has_initial_checkpoint = yes
has_marker_output = no
is_outputting_averaged_fields = no

[mesh]
xlength = 1
ylength = 1
zlength = 1
resolution = 0.25
quality_check_step_interval = 1000
remeshing_option = 0

[control]
gravity = 0
fixed_dt = 1
inertial_scaling = 1.0e5
damping_option = 2
damping_factor = 1
surface_process_option = 0
has_moving_mesh = no
use_global_velocity_scaling = no
is_using_mixed_stress = no
has_PT = no

has_thermal_diffusion = no
has_hydraulic_diffusion = no

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = 0
vbc_val_x1 = 0
vbc_z0 = 1
vbc_z1 = 1
vbc_val_z0 = 0
vbc_val_z1 = -1.0e-3
has_winkler_foundation = no
has_elastic_foundation = no
has_water_loading = no

[ic]
weakzone_option = 0

[mat]
rheology_type = elastic
is_plane_strain = yes
num_materials = 1
rho0 = [1]
alpha = [0]
bulk_modulus = [2.0e8]
shear_modulus = [2.0e8]

[monitor]
enabled = no
