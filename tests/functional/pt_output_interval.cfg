# Stationary 2D/3D patch for step/time output scheduling, including overflow.
[sim]
modelname = interval
max_steps = 64
max_time_in_yr = 1
output_step_interval = 1
checkpoint_frame_interval = 1
is_outputting_averaged_fields = no
has_initial_checkpoint = yes

[mesh]
meshing_option = 1
meshing_elem_shape = 1
xlength = 1
ylength = 1
zlength = 1
resolution = 1
quality_check_step_interval = 1
remeshing_option = 0

[control]
gravity = 0
fixed_dt = 0.001
has_moving_mesh = false
has_thermal_diffusion = false
has_hydraulic_diffusion = false

[bc]
vbc_x0 = 3
vbc_x1 = 3
vbc_y0 = 3
vbc_y1 = 3
vbc_z0 = 3
vbc_z1 = 3
vbc_val_x0 = 0
vbc_val_x1 = 0
vbc_val_y0 = 0
vbc_val_y1 = 0
vbc_val_z0 = 0
vbc_val_z1 = 0

[ic]
has_body_force_adjustment = false

[mat]
rheology_type = elastic
rho0 = [2700]
bulk_modulus = [2e10]
shear_modulus = [1e10]
