[sim]
modelname = __MODELNAME__
max_steps = 40
output_step_interval = 40
checkpoint_frame_interval = 1
has_initial_checkpoint = no
has_marker_output = no
has_output_during_remeshing = no
is_outputting_averaged_fields = no

[mesh]
xlength = 1
ylength = 1
zlength = 1
resolution = 0.25
quality_check_step_interval = 1000
remeshing_option = 0

[control]
gravity = 10
fixed_dt = 1e-6
inertial_scaling = 1e9
is_quasi_static = no
surface_process_option = 0
damping_option = 1
damping_factor = 0.3
has_moving_mesh = no
has_thermal_diffusion = no
has_hydraulic_diffusion = yes

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = 0
vbc_val_x1 = 0
vbc_y0 = 1
vbc_y1 = 1
vbc_val_y0 = 0
vbc_val_y1 = 0
vbc_z0 = 1
vbc_z1 = 1
vbc_val_z0 = 0
vbc_val_z1 = 0
hbc_x0 = 0
hbc_x1 = 0
hbc_y0 = 0
hbc_y1 = 0
hbc_z0 = 0
hbc_z1 = 0
has_winkler_foundation = no
has_water_loading = no

[ic]
weakzone_option = 0
temperature_option = 0

[mat]
rheology_type = elastic
is_plane_strain = yes
num_materials = 1
rho0 = [1]
alpha = [0]
bulk_modulus = [1e9]
shear_modulus = [1e9]
heat_capacity = [1e3]
therm_cond = [1e-12]
porosity = [0.2]
hydraulic_perm = [1e-20]
fluid_rho0 = [1e3]
fluid_alpha = [0]
fluid_bulk_modulus = [2.17e9]
fluid_visc = [1e-3]
biot_coeff = [1]
bulk_modulus_s = [37e9]

[injection]
enabled = __ENABLED__
num_points = 1
points_x = [0.5]
points_z = [-0.5]
points_unit = m
rate_model = __RATE_MODEL__
rate = [__RATE__]
total_amount = [__TOTAL_AMOUNT__]
start_time_in_yr = [0]
duration_in_yr = [__DURATION_YR__]

[monitor]
enabled = yes
step_interval = 1
num_points = 3
points_x = [0.5, 0.25, 0.75]
points_z = [-0.5, -0.5, -0.5]
points_unit = m
remesh_rebind_mode = initial_coord
output_prefix = monitor
write_header = yes
output_coord = yes
output_velocity = no
output_pore_pressure = yes
