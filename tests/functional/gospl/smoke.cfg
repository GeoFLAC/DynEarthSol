# Bounded tutorial-derived MPI coupling example: 8 DES steps, 4 exchanges.
# Run inside a private directory holding gospl.yml; see doc/mpi-quickstart.md.
# Increase control.gospl_coupling_frequency to exchange less often.
# Decrease mesh.resolution for a larger DES mesh.
[sim]
modelname = result
max_time_in_yr = 1e20
output_time_interval_in_yr = 1e20
output_step_interval = 2
info_display_step_interval = 2
has_output_during_remeshing = no
is_outputting_averaged_fields = no
checkpoint_frame_interval = 1
max_steps = 8
is_restarting = no

[mesh]
meshing_option = 1
xlength = 100e3
ylength = 80e3
zlength = 10e3
resolution = 10000
largest_size = 125
smallest_size = 0.125
refined_zonex = [0.3, 0.7]
refined_zoney = [0.0, 1.0]
refined_zonez = [0.0, 1.0]
mmg_hausd_factor = 0.05
quality_check_step_interval = 1000
min_quality = 0.2
max_boundary_distortion = 0.2
remeshing_option = 11
meshing_elem_shape = 1

[control]
surface_process_option = 11
surface_process_gospl_config_file = gospl.yml
gospl_coupling_frequency = 2
gospl_velocity_coupling = true
gospl_mesh_resolution = 10000
gospl_mesh_perturbation = 0
gospl_mesh_padding = 0.1
dt_fraction = 1.0
inertial_scaling = 1e4

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = -4.756468797564688e-10
vbc_val_x1 = 4.756468797564688e-10
vbc_y0 = 1
vbc_y1 = 1
vbc_val_y0 = 0
vbc_val_y1 = 0
has_water_loading = no
surface_temperature = 273
mantle_temperature = 273

[ic]
weakzone_option = 4
weakzone_azimuth = 0.0
weakzone_inclination = -45.0
weakzone_halfwidth = 1.2
weakzone_depth_min = 0.5
weakzone_depth_max = 1.0
weakzone_xcenter = 0.5
weakzone_ycenter = 0.5
weakzone_zcenter = 1.0
weakzone_y_min = 0.0
weakzone_y_max = 1.0
weakzone_plstrain = 0.5
weakzone_gaussian_amplitude = -4000
weakzone_standard_deviation = 1e4

[mat]
rheology_type = elasto-plastic
rho0 = [2700]
alpha = [0]
bulk_modulus = [50e9]
shear_modulus = [30e9]
pls0 = [0]
pls1 = [0.5]
cohesion0 = [4.4e7]
cohesion1 = [4e6]
friction_angle0 = [30]
friction_angle1 = [30]
min_viscosity = 1e24
