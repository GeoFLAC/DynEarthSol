# Continental erosion/diffusion only, for the bounded coupling example.
name: Gaussian weakzone 3D rift (DES-GoSPL)
domain:
  npdata:
  - ./gospl_mesh
  - v
  - c
  - z
  flowdir: 6
  seadepo: false
  bc: fofo
output:
  dir: gospl-output
time:
  start: 0.0
  end: 1.0e+20
  tout: 1.0
  dt: 1.0
spl:
  K: 1.0e-05
  d: 0.0
  m: 0.4
diffusion:
  hillslopeKa: 0.01
  hillslopeKm: 1.0
sea:
  position: -2000.0
climate:
- start: 0.0
  uniform: 1
