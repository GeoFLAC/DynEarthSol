vbc_val_y1 = 1.0e-6
vbc_z0 = 0
vbc_z1 = 0
vbc_val_z0 = 0
vbc_val_z1 = 0
has_winkler_foundation = no
has_water_loading = no
surface_temperature = 273
mantle_temperature = 273

[ic]
mattype_option = 0
weakzone_option = 0
temperature_option = 0

[mat]
