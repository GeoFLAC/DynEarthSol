# Geodynamic World Builder initial conditions, 2D (usegwb=1): temperature,
# materials and weak zone from gwb-2d.wb, a subduction cross section with a
# plate-interface fault. check_gwb.py compares the initial fields with
# gwb-dat; benchmarks-cores' fresh-restart-cmp checks a restart (the world
# path is relative to benchmarks-cores, where that test runs).
[sim]
modelname = functional-test-gwb
max_time_in_yr = 25e3
output_time_interval_in_yr = 5e3
checkpoint_frame_interval = 1
has_output_during_remeshing = no
is_outputting_averaged_fields = no
# is_restarting = yes
# restarting_from_modelname = functional-test-gwb
restarting_from_frame = 2

[mesh]
meshing_option = 1
xlength = 600e3
ylength = 100e3
zlength = 200e3
resolution = 10e3
largest_size = 4
smallest_size = 0.04
quality_check_step_interval = 500
min_quality = 0.2
remeshing_option = 11

[control]
inertial_scaling = 1e4
ref_pressure_option = 1

[bc]
surface_temperature = 273
mantle_temperature = 1573
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = 1e-9
vbc_val_x1 = 0
has_water_loading = no

[ic]
temperature_option = 936
mattype_option = 936
weakzone_option = 936
weakzone_plstrain = 1
gwb_filename = ../tests/functional/gwb/gwb-2d.wb

[mat]
rheology_type = elasto-visco-plastic
num_materials = 3
rho0            = [ 2880,    2800,    3300   ]
alpha           = [ 3e-5 ]
bulk_modulus    = [ 50e9 ]
shear_modulus   = [ 30e9 ]
visc_exponent   = [ 3.05,    3.05,    3.00   ]
visc_coefficient = [ 1.25e-1, 1.25e-1, 7.00e4 ]
visc_activation_energy = [ 3.76e5, 2.76e5, 5.20e5 ]
heat_capacity   = [ 1000 ]
therm_cond      = [ 3.3 ]
pls0            = [ 0 ]
pls1            = [ 0.1 ]
cohesion0       = [ 4e7 ]
cohesion1       = [ 4e6 ]
friction_angle0 = [ 30 ]
friction_angle1 = [ 15 ]
dilation_angle0 = [ 0 ]
dilation_angle1 = [ 0 ]
max_viscosity = 1e24
min_viscosity = 1e19
