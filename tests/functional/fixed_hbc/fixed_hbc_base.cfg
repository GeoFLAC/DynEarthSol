# Focused fixed pore-pressure lifecycle regression template.

[sim]
modelname = __MODELNAME__
max_steps = __MAX_STEPS__
output_step_interval = __OUTPUT_STEP_INTERVAL__
checkpoint_frame_interval = 1
has_initial_checkpoint = __HAS_INITIAL_CHECKPOINT__
is_restarting = __IS_RESTARTING__
restarting_from_modelname = __RESTARTING_FROM_MODELNAME__
restarting_from_frame = 0
has_marker_output = yes
is_outputting_averaged_fields = no
has_output_during_remeshing = __HAS_OUTPUT_DURING_REMESHING__

[mesh]
meshing_option = 1
meshing_elem_shape = 1
xlength = 1
ylength = 1
zlength = 1
resolution = 0.5
quality_check_step_interval = __QUALITY_CHECK_STEP_INTERVAL__
min_quality = __MIN_QUALITY__
remeshing_option = __REMESHING_OPTION__

[control]
gravity = 0
fixed_dt = 1.0e-2
inertial_scaling = 1.0e13
is_quasi_static = no
surface_process_option = 0
has_moving_mesh = __HAS_MOVING_MESH__
use_global_velocity_scaling = no
damping_option = 2
damping_factor = 1
has_PT = no
has_thermal_diffusion = no
has_hydraulic_diffusion = __HYDRAULIC_ENABLED__
has_pore_pressure_effective_stress = __EFFECTIVE_STRESS_ENABLED__
has_poroelastic_pressure_feedback = no

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = 0
vbc_val_x1 = 0
vbc_y0 = 1
vbc_y1 = 1
vbc_val_y0 = 0
vbc_val_y1 = 0
vbc_z0 = 1
vbc_z1 = 1
vbc_val_z0 = __VBC_VALUE_Z0__
vbc_val_z1 = 0
has_winkler_foundation = no
has_water_loading = no
__HBC_CONFIG__

[ic]
weakzone_option = 0
temperature_option = 0
excess_pore_pressure = 0

[mat]
rheology_type = elastic
is_plane_strain = no
num_materials = 1

rho0 = [1]
alpha = [0]
bulk_modulus = [2.0e8]
shear_modulus = [2.0e8]
heat_capacity = [1.0e3]
therm_cond = [1.0e-12]

porosity = [0.1]
hydraulic_perm = [1.0e-13]
fluid_rho0 = [1.0e3]
fluid_alpha = [0]
fluid_bulk_modulus = [1.0e10]
fluid_visc = [1.0e-3]
biot_coeff = [1]
bulk_modulus_s = [1.0e10]
