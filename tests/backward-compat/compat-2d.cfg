# The case that check_backward_compat.py runs with every build in its window: a small 2D rift
# with markers, a frame and a checkpoint every 100 steps, and a remesh at every quality check
# (the bottom moves more than max_boundary_distortion between checks), so the last checkpoint
# follows remeshes. Every build in the window must accept each key here.

[sim]
modelname = compat
max_steps = 200
output_step_interval = 100
output_time_interval_in_yr = 1e30
checkpoint_frame_interval = 1
has_marker_output = yes

[mesh]
meshing_option = 1
xlength = 100e3
ylength = 100e3
zlength = 30e3
resolution = 3e3
quality_check_step_interval = 50
min_quality = 0.2
max_boundary_distortion = 1e-3
remeshing_option = 1

[markers]
init_marker_option = 2
init_marker_spacing = 0.3

[control]
ref_pressure_option = 1

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = -1e-9
vbc_val_x1 = 1e-9
has_water_loading = no

[ic]
weakzone_option = 3
weakzone_standard_deviation = 5e3
weakzone_xcenter = 0.5
weakzone_ycenter = 0
weakzone_zcenter = 0.2
weakzone_plstrain = 1
oceanic_plate_age_in_yr = 100e6

[mat]
rheology_type = elasto-visco-plastic
num_materials = 2
rho0 = [ 2800, 3300 ]
alpha = [ 3e-5 ]
bulk_modulus = [ 50e9 ]
shear_modulus = [ 30e9 ]
visc_exponent = [ 3.05 ]
visc_coefficient = [ 1.25e-1 ]
visc_activation_energy = [ 3.76e5 ]
heat_capacity = [ 1000 ]
therm_cond = [ 3.3 ]
pls0 = [ 0 ]
pls1 = [ 0.1 ]
cohesion0 = [ 4e7 ]
cohesion1 = [ 4e6 ]
friction_angle0 = [ 30 ]
friction_angle1 = [ 30 ]
dilation_angle0 = [ 0 ]
dilation_angle1 = [ 0 ]
max_viscosity = 1e24
min_viscosity = 1e19
