name: GWB build

permissions:
  contents: read

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**/README.md'
      - 'LICENSE'
      - '.zenodo.json'
      - 'CITATION.cff'
      - '*.md'
      - '*.py'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**/README.md'
      - 'LICENSE'
      - '.zenodo.json'
      - 'CITATION.cff'
      - '*.md'
      - '*.py'

env:
  # The Geodynamic World Builder commit built and tested against; bump it deliberately.
  GWB_SHA: c092c5aa629bc28dbacf7fdc7cb6fe033f283af0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: python -m pip install --upgrade pip numpy

    - name: get boost
      run: |
        sudo apt-get update
        sudo apt-get install -y libboost-program-options-dev

    - name: cache GWB
      id: cache-gwb
      uses: actions/cache@v4
      with:
        path: ~/gwb
        key: gwb-${{ runner.os }}-${{ env.GWB_SHA }}

    # A shared library, as the Makefile expects (GWB installs it in bin/). gwb-dat, GWB's
    # point-query application, is the reference the tests compare with.
    - name: build GWB
      if: steps.cache-gwb.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/GeodynamicWorldBuilder/WorldBuilder.git gwb-src
        git -C gwb-src checkout "$GWB_SHA"
        cmake -S gwb-src -B gwb-src/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
          -DWB_ENABLE_TESTS=OFF -DWB_ENABLE_PYTHON=OFF -DWB_MAKE_FORTRAN_WRAPPER=OFF \
          -DCMAKE_INSTALL_PREFIX="$HOME/gwb"
        cmake --build gwb-src/build -j 4
        cmake --install gwb-src/build
        cp gwb-src/build/bin/gwb-dat "$HOME/gwb/bin/"
        rm -rf gwb-src

    - name: make 2d with mmg and gwb
      run: make ndims=2 usemmg=1 usegwb=1 GWB_DIR="$HOME/gwb" -j 4

    - name: test 2d gwb initial conditions
      working-directory: ./tests/functional
      run: |
        LD_LIBRARY_PATH="$HOME/gwb/bin" python3 gwb/check_gwb.py \
          --exe ../../dynearthsol2d --gwb-dat "$HOME/gwb/bin/gwb-dat" gwb/gwb-2d.cfg

    - name: test 2d gwb restart
      working-directory: ./benchmarks-cores
      run: make fresh-restart-cmp NDIMS=2 CASE=../tests/functional/gwb/gwb-2d.cfg

    - name: make 3d with mmg and gwb
      run: make ndims=3 usemmg=1 usegwb=1 GWB_DIR="$HOME/gwb" -j 4

    - name: test 3d gwb initial conditions
      working-directory: ./tests/functional
      run: |
        LD_LIBRARY_PATH="$HOME/gwb/bin" python3 gwb/check_gwb.py \
          --exe ../../dynearthsol3d --gwb-dat "$HOME/gwb/bin/gwb-dat" gwb/gwb-3d.cfg

    - name: make 2d without gwb
      run: make ndims=2 usemmg=1 -j 4

    - name: test that a build without gwb refuses option 936
      working-directory: ./tests/functional
      run: python3 gwb/check_gwb.py --exe ../../dynearthsol2d --unsupported gwb/gwb-2d.cfg
