name: Functional tests

permissions:
  contents: read

on:
  push:
    branches: [ "master", "bugfix*" ]
    paths-ignore:
      - '**/README.md'
      - 'LICENSE'
      - '.zenodo.json'
      - 'CITATION.cff'
      - '*.md'
      - '*.py'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**/README.md'
      - 'LICENSE'
      - '.zenodo.json'
      - 'CITATION.cff'
      - '*.md'
      - '*.py'

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tests/functional
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Python dependencies
      run: python -m pip install --upgrade pip numpy h5py

    - name: get hdf5
      run: |
        echo Install hdf5 ====================
        sudo apt-get update
        sudo apt-get install -y libhdf5-serial-dev make pkg-config
    - name: make 3d hdf5
      working-directory: .
      # No HDF5_*_DIR here or below: the Makefile finds the paths itself.
      run: make -j ndims=3 opt=2 openmp=1 hdf5=1

    - name: test 3d monitoring, output and restart
      run: |
        for method in pt explicit gvs; do
          OMP_NUM_THREADS=1 python3 pt_output_schedule.py ../../dynearthsol3d pt_output_interval.cfg output-interval-3d-$method --schedule overflow --method $method
          OMP_NUM_THREADS=1 python3 pt_output_schedule.py ../../dynearthsol3d pt_output_interval.cfg output-step-change-3d-$method --schedule step --step-after-restart 6 --method $method
          OMP_NUM_THREADS=1 python3 pt_output_schedule.py ../../dynearthsol3d pt_output_interval.cfg output-time-change-3d-$method --schedule time --time-after-restart 3.5 --method $method
        done
        python3 monitor_restart/run_monitor_restart.py --exe ../../dynearthsol3d --threads 1
        python3 monitor_restart/check_state.py ../../dynearthsol3d monitor-state-3d
        OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python3 check_restart_dt.py ../../dynearthsol3d restart-dt-3d

    - name: test 3d seismic moment
      working-directory: ./tests/earthquake-moment-test
      run: make check ndims=3

    - name: test 3d evp regular remesh temp-dome
      run: ../../dynearthsol3d 3d-evp-regular.cfg && rm -rf functional-test.*

    - name: test 3d restart
      working-directory: ./benchmarks-cores
      run: make fresh-restart-cmp CASE=../tests/functional/3d-evp-regular.cfg && rm -rf functional-test.*

    - name: make 2d hdf5
      working-directory: .
      run: make -j ndims=2 opt=2 openmp=1 hdf5=1

    - name: test 2d monitoring, output and restart
      run: |
        for method in pt explicit gvs; do
          OMP_NUM_THREADS=1 python3 pt_output_schedule.py ../../dynearthsol2d pt_output_interval.cfg output-interval-2d-$method --schedule overflow --method $method
          OMP_NUM_THREADS=1 python3 pt_output_schedule.py ../../dynearthsol2d pt_output_interval.cfg output-step-change-2d-$method --schedule step --step-after-restart 6 --method $method
          OMP_NUM_THREADS=1 python3 pt_output_schedule.py ../../dynearthsol2d pt_output_interval.cfg output-time-change-2d-$method --schedule time --time-after-restart 3.5 --method $method
        done
        python3 monitor_restart/run_monitor_restart.py --exe ../../dynearthsol2d --threads 1
        python3 monitor_restart/check_state.py ../../dynearthsol2d monitor-state-2d
        OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python3 monitor/check_monitor_tracking.py ../../dynearthsol2d monitor-tracking-2d
        OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python3 check_restart_dt.py ../../dynearthsol2d restart-dt-2d

    - name: test 2d seismic moment
      working-directory: ./tests/earthquake-moment-test
      run: make check ndims=2

    - name: test elastic plane-strain stress update
      run: python3 plane_strain_elastic/run_plane_strain_elastic.py ../../dynearthsol2d

    - name: test displacement and explicit remesh continuation
      run: |
        python3 displacement_output/run_displacement_output.py --exe-2d ../../dynearthsol2d --exe-3d ../../dynearthsol3d --expected-format hdf5 --threads 1
        python3 check_remesh_restart.py ../../dynearthsol2d remesh-restart
        OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python3 check_gvs_mass.py ../../dynearthsol2d gvs-mass-2d
        OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python3 check_gvs_mass.py ../../dynearthsol3d gvs-mass-3d

    - name: test 2d ep irregular remesh
      run: ../../dynearthsol2d 2d-ep-irregular.cfg && rm -rf functional-test.*

    - name: test 2d restart
      working-directory: ./benchmarks-cores
      run: make fresh-restart-cmp NDIMS=2 CASE=../tests/functional/2d-ep-irregular.cfg && rm -rf functional-test.*

    - name: test 2d RSF ATS benchmark subset
      run: bash 2d-rsf-ats.sh

    - name: test 2d homogeneous initial stress
      run: python3 initial_stress/check_initial_stress.py --exe ../../dynearthsol2d

    - name: test that bad config files are rejected
      run: python3 bad_input/check_bad_input.py --exe ../../dynearthsol2d

    - name: make 3d hdf5 opt=-1
      working-directory: .
      run: make cleanall && make -j ndims=3 opt=-1 openmp=1 hdf5=1

    - name: test memory leak 3d evp regular remesh temp-dome
      run: ../../dynearthsol3d 3d-evp-regular.cfg && rm -rf functional-test.*
