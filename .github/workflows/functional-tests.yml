name: Functional tests

permissions:
  contents: read

on:
  push:
    branches: [ "master", "bugfix*" ]
    paths-ignore:
      - '**/README.md'
      - 'LICENSE'
      - '.zenodo.json'
      - 'CITATION.cff'
      - '*.md'
      - '*.py'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**/README.md'
      - 'LICENSE'
      - '.zenodo.json'
      - 'CITATION.cff'
      - '*.md'
      - '*.py'

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tests/functional
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Python dependencies
      run: python -m pip install --upgrade pip numpy h5py

    - name: get boost and hdf5
      run: |
        echo Install boost-program-options and hdf5 ====================
        sudo apt-get update
        sudo apt-get install -y libboost-program-options-dev libhdf5-serial-dev make pkg-config
    - name: make 3d hdf5
      working-directory: .
      # No HDF5_*_DIR here or below: the Makefile finds the paths itself.
      run: make -j ndims=3 opt=2 openmp=1 hdf5=1

    - name: test 3d fastest-element timestep diagnostic
      run: >-
        PYTHONDONTWRITEBYTECODE=1
        python3 timestep_diagnostics/run_fastest_element.py
        --exe ../../dynearthsol3d --threads 1 4

    - name: test 3d monitor query-coordinate binding
      run: >-
        OMP_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1
        python3 monitor_coordinates/run_monitor_coordinates.py
        --exe ../../dynearthsol3d

    - name: test 3d evp regular remesh temp-dome
      run: ../../dynearthsol3d 3d-evp-regular.cfg && rm -rf functional-test.*

    - name: test 3d restart
      working-directory: ./benchmarks-cores
      run: make fresh-restart-cmp CASE=../tests/functional/3d-evp-regular.cfg && rm -rf functional-test.*

    - name: make 2d hdf5
      working-directory: .
      run: make -j ndims=2 opt=2 openmp=1 hdf5=1

    - name: test pressure-form hydraulic diffusion
      run: >-
        PYTHONDONTWRITEBYTECODE=1
        python3 hydraulic_pressure_form/run_hydraulic_pressure_form.py
        --exe-2d ../../dynearthsol2d --exe-3d ../../dynearthsol3d
        --threads 1 4

    - name: test elastic plane-strain stress update
      run: >-
        PYTHONDONTWRITEBYTECODE=1
        python3 plane_strain_elastic/run_plane_strain_elastic.py
        --exe ../../dynearthsol2d --threads 1 4

    - name: test poroelastic controls and validation
      run: >-
        PYTHONDONTWRITEBYTECODE=1
        python3 poroelastic_controls/run_poroelastic_controls.py
        --exe-2d ../../dynearthsol2d --exe-3d ../../dynearthsol3d
        --threads 1 4 --clean

    - name: test reference fluid density and water loading
      run: >-
        PYTHONDONTWRITEBYTECODE=1
        python3 hydromechanics_density/run_hydromechanics_density.py
        --exe-2d ../../dynearthsol2d --exe-3d ../../dynearthsol3d
        --threads 1 4

    - name: test poroelastic total-stress bridge in HDF5
      run: >-
        PYTHONDONTWRITEBYTECODE=1
        python3 total_stress/run_total_stress.py
        --exe-2d ../../dynearthsol2d --exe-3d ../../dynearthsol3d
        --expected-format hdf5 --threads 1 4

    - name: test nodal displacement output in HDF5
      run: >-
        PYTHONDONTWRITEBYTECODE=1
        python3 displacement_output/run_displacement_output.py
        --exe-2d ../../dynearthsol2d --exe-3d ../../dynearthsol3d
        --expected-format hdf5 --threads 1 4

    - name: test boundary projection cache after remeshing
      run: >-
        PYTHONDONTWRITEBYTECODE=1
        python3 boundary_remesh/run_boundary_remesh.py
        --exe ../../dynearthsol2d --threads 1 4

    - name: test monitor CSV restart history
      run: |
        PYTHONDONTWRITEBYTECODE=1 python3 monitor_restart/run_monitor_restart.py \
          --exe ../../dynearthsol2d --threads 1
        PYTHONDONTWRITEBYTECODE=1 python3 monitor_restart/run_monitor_restart.py \
          --exe ../../dynearthsol2d --threads 4

    - name: test velocity-boundary safety guards
      run: >-
        PYTHONDONTWRITEBYTECODE=1
        python3 boundary_safety/run_boundary_safety.py
        --exe-2d ../../dynearthsol2d --exe-3d ../../dynearthsol3d
        --threads 1 4

    - name: test fluid point-source validation
      run: |
        OMP_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1 \
          python3 point_source_validation/run_point_source_validation.py \
          --clean --run-dir point_source_validation/runs_omp1 \
          --exe-2d ../../dynearthsol2d --exe-3d ../../dynearthsol3d
        OMP_NUM_THREADS=4 PYTHONDONTWRITEBYTECODE=1 \
          python3 point_source_validation/run_point_source_validation.py \
          --clean --run-dir point_source_validation/runs_omp4 \
          --exe-2d ../../dynearthsol2d --exe-3d ../../dynearthsol3d

    - name: test fluid point-injection schedules
      run: |
        OMP_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1 \
          python3 point_injection/run_point_injection.py --clean \
          --run-dir point_injection/runs_omp1 --exe ../../dynearthsol2d
        OMP_NUM_THREADS=4 PYTHONDONTWRITEBYTECODE=1 \
          python3 point_injection/run_point_injection.py --clean \
          --run-dir point_injection/runs_omp4 --exe ../../dynearthsol2d
        PYTHONDONTWRITEBYTECODE=1 python3 point_injection/check_point_injection.py \
          point_injection/runs_omp1/constant_rate \
          point_injection/runs_omp4/constant_rate \
          point_injection/runs_omp1/source_disabled
        PYTHONDONTWRITEBYTECODE=1 python3 point_injection/check_point_injection.py \
          point_injection/runs_omp1/total_amount \
          point_injection/runs_omp4/total_amount \
          point_injection/runs_omp1/source_disabled
        cmp point_injection/runs_omp1/source_disabled/monitor_point_0.csv \
          point_injection/runs_omp4/source_disabled/monitor_point_0.csv
        cmp point_injection/runs_omp1/source_disabled/monitor_point_1.csv \
          point_injection/runs_omp4/source_disabled/monitor_point_1.csv
        cmp point_injection/runs_omp1/source_disabled/monitor_point_2.csv \
          point_injection/runs_omp4/source_disabled/monitor_point_2.csv

    - name: test 2d ep irregular remesh
      run: ../../dynearthsol2d 2d-ep-irregular.cfg && rm -rf functional-test.*

    - name: test 2d restart
      working-directory: ./benchmarks-cores
      run: make fresh-restart-cmp NDIMS=2 CASE=../tests/functional/2d-ep-irregular.cfg && rm -rf functional-test.*

    - name: test 2d RSF ATS benchmark subset
      run: bash 2d-rsf-ats.sh

    - name: make 2d raw-binary output
      working-directory: .
      run: make -j ndims=2 opt=2 openmp=1 hdf5=0

    - name: test nodal displacement raw-binary reader
      run: >-
        PYTHONDONTWRITEBYTECODE=1
        python3 displacement_output/run_displacement_output.py
        --exe-2d ../../dynearthsol2d --expected-format binary --threads 1

    - name: test poroelastic total-stress bridge in raw binary
      run: >-
        PYTHONDONTWRITEBYTECODE=1
        python3 total_stress/run_total_stress.py
        --exe-2d ../../dynearthsol2d
        --expected-format binary --threads 1 4

    - name: make 3d hdf5 opt=-1
      working-directory: .
      run: make cleanall && make -j ndims=3 opt=-1 openmp=1 hdf5=1

    - name: test memory leak 3d evp regular remesh temp-dome
      run: ../../dynearthsol3d 3d-evp-regular.cfg && rm -rf functional-test.*
