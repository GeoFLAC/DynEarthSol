name: Release with submodules and Zenodo

# Published releases are immutable: GitHub refuses asset uploads once a release
# is published, and draft releases fire no events to hook. So the tarball is
# attached while the release is still a draft (push a tag, or dispatch this
# workflow with an existing tag), and the maintainer publishes that draft.
# Publishing then sends the very asset that was attached on to Zenodo. Both the
# tag push and the release event run this file from the tagged commit, so the
# tag has to carry it. A benchmarks-v* tag is packaged the same way, minus the
# Zenodo step.

on:
  push:
    tags: [ "v*", "benchmarks-v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package into a draft release"
        required: true
  release:
    types: [published]
  pull_request:
    branches: [ "master" ]

jobs:
  # 1. Tag pushed (or dispatched, or a PR dry run): build the tarball, and for a
  #    tag attach it to a DRAFT release for the maintainer to publish.
  draft:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1
        ref: ${{ github.event.inputs.tag || github.ref }}

    # Complete tarball containing all submodules. The label is the tag being
    # released, or the short commit SHA for a pull request dry run.
    - name: create source tarball with submodules and shallow .git
      run: |
        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          LABEL="${GITHUB_SHA::8}"
        else
          LABEL="${{ github.event.inputs.tag || github.ref_name }}"
        fi
        ARCHIVE_NAME="dynearthsol-${LABEL}-full"
        mkdir -p /tmp/${ARCHIVE_NAME}

        rsync -a . /tmp/${ARCHIVE_NAME}/ \
          --exclude='.github' \
          --exclude='output_files' \
          --exclude='*.tar.gz'

        tar -czf /tmp/${ARCHIVE_NAME}.tar.gz -C /tmp ${ARCHIVE_NAME}
        echo "TARBALL=/tmp/${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
        echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

    # 2. Pull request: keep the tarball as a build artifact only.
    - name: upload artifact (PR)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARCHIVE_NAME }}
        path: ${{ env.TARBALL }}

    # 3. Tag: create or update the draft release carrying the tarball. Assets can
    #    still be added here; after publishing they cannot.
    - name: attach the tarball to a draft release
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        draft: true
        files: ${{ env.TARBALL }}
        fail_on_unmatched_files: true

  # ===================================================
  # Zenodo Upload Section (only when a release is published)
  # ===================================================

  # 4. Send the asset the draft carried to the manually opened Zenodo draft, so
  #    the deposit is byte-identical to the GitHub asset rather than a rebuild.
  zenodo:
    # A benchmarks-v* tag names no reserved DOI in its CITATION.cff, so there is
    # no deposit to fill; it gets the draft release and its tarball only.
    if: github.event_name == 'release' && !startsWith(github.ref_name, 'benchmarks-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    # The tag's own CITATION.cff names the reserved DOI, and .zenodo.json the
    # metadata, so check out the released tag rather than the default branch.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: download the tarball attached to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p output_files
        gh release download "${GITHUB_REF_NAME}" \
          --repo "${GITHUB_REPOSITORY}" \
          --pattern 'dynearthsol-*-full.tar.gz' \
          --dir output_files
        ls -l output_files

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests

    - name: Upload to Existing Zenodo Draft
      env:
        ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      run: python .github/workflows/scripts/upload_to_zenodo.py
