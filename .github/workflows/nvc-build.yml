name: nvc build

on:
  push:
    branches:
      - "**gpu**"
      - "**GPU**"
      - "**cuda**"
      - "**CUDA**"
    paths-ignore:
      - '**/README.md'
      - 'LICENSE'
      - '.zenodo.json'
      - 'CITATION.cff'
      - '*.md'
      - '*.py'

  pull_request:
    branches:
      - "master"
    paths-ignore:
      - '**/README.md'
      - 'LICENSE'
      - '.zenodo.json'
      - 'CITATION.cff'
      - '*.md'
      - '*.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check-duplicate:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Check if there is an open PR associated with the current branch
            PR_COUNT=$(gh pr list --repo ${{ github.repository }} --head ${{ github.ref_name }} --state open --json number | jq length)
            
            if [[ "$PR_COUNT" -gt 0 ]]; then
              echo "Open PR found. Skipping this push CI."
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  detect-changes:
    needs: check-duplicate
    # Only run if the interceptor did not flag to skip
    if: ${{ needs.check-duplicate.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      docker_changed: ${{ steps.filter.outputs.docker_changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker_changed:
              - 'docker/**'

  build-and-push-image:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docker_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo_name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.cuda
          tags: ghcr.io/${{ env.REPO_LC }}/nvhpc-build-env:latest

          # zstd layers decompress far faster than gzip, which is most of what
          # "Starting job container" spends its time on. It needs OCI media
          # types, and the provenance attestation is disabled so the pushed tag
          # stays a plain image manifest for the runner to pull.
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
          provenance: false

          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LC }}/nvhpc-build-env:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LC }}/nvhpc-build-env:buildcache,mode=max,compression=zstd

  nvc-build:
    needs: [check-duplicate, detect-changes, build-and-push-image]
    # Skip if the interceptor flagged it (prevents downstream execution)
    if: |
      !failure() && !cancelled() &&
      needs.check-duplicate.outputs.should_skip != 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: "2D_All_Targets"
            ndims: 2
          - target_name: "3D_All_Targets"
            ndims: 3

    name: Build ${{ matrix.target_name }}

    container:
      # need lowercase for ghcr.io
      image: ghcr.io/geoflac/dynearthsol/nvhpc-build-env:latest

    steps:
    - uses: actions/checkout@v4

    - name: Fix git safe directory
      run: git config --global --add safe.directory '*'

    - name: set path for nvc (${{ matrix.ndims }}D)
      # No HDF5_*_DIR: the Makefile finds the paths itself.
      run: |
        echo "BASE_MAKE=make hdf5=1 NVHPC_DIR=$NVHPC_DIR" >> $GITHUB_ENV

    - name: make ndims=${{ matrix.ndims }} openacc=1 SM=80 hdf5=1
      run: make clean openacc=1 ndims=${{ matrix.ndims }} && $BASE_MAKE ndims=${{ matrix.ndims }} openacc=1 hdf5=1 SM=80 -j

    - name: make ndims=${{ matrix.ndims }} openacc=1 SM=80 hdf5=1 usemmg=1
      run: make clean openacc=1 ndims=${{ matrix.ndims }} && $BASE_MAKE ndims=${{ matrix.ndims }} openacc=1 hdf5=1 usemmg=1 SM=80 -j

    - name: make ndims=${{ matrix.ndims }} openacc=1 nprof=1 SM=80 hdf5=1
      run: make cleanall openacc=1 ndims=${{ matrix.ndims }} && $BASE_MAKE ndims=${{ matrix.ndims }} openacc=1 hdf5=1 nprof=1 SM=80 -j

    - name: make ndims=${{ matrix.ndims }} nprof=1 opt=0 hdf5=1
      run: make cleanall ndims=${{ matrix.ndims }} && $BASE_MAKE ndims=${{ matrix.ndims }} hdf5=1 nprof=1 opt=0 -j