name: C++20 compatibility

permissions:
  contents: read

# The code is C++17 but must also compile as C++20 (CONTRIBUTING.md). Each job
# builds 2D and 3D with the Makefile's standard switched to C++20 and fails on
# an error or on a C++20 deprecation warning in DES's own sources. g++ and
# clang report different deprecations, so both run.

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - '**.cxx'
      - '**.hpp'
      - '**.cpp'
      - '**.c'
      - '**.h'
      - 'Makefile'
      - 'tests/functional/mpi/**'
      - '.github/workflows/cxx20-compat.yml'
      - '.github/workflows/scripts/cxx20-check.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gcc:
    runs-on: ubuntu-latest
    container: gcc:15
    steps:
      - uses: actions/checkout@v4

      # As in omp-gcc-matrix; `|| true` tolerates act runs from a git worktree.
      - name: Fix git safe directory
        run: git config --global --add safe.directory '*' || true

      - name: g++ version
        run: g++ --version

      - name: build as C++20
        run: bash .github/workflows/scripts/cxx20-check.sh opt=2 openmp=1 hdf5=0

  clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install clang and libomp
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libomp-dev

      - name: clang version
        run: clang++ --version

      - name: build as C++20
        run: bash .github/workflows/scripts/cxx20-check.sh CXX=clang++ opt=2 openmp=1 hdf5=0

  mpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install MPI, METIS and HDF5
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev libmetis-dev libhdf5-serial-dev python3-numpy python3-h5py

      - name: build MPI as C++17
        run: |
          for nd in 2 3; do
            make -j4 ndims=$nd usempi=1 usemetis=1 openmp=1 hdf5=1
          done

      - name: build MPI as C++20 without first-party deprecations
        run: |
          bash .github/workflows/scripts/cxx20-check.sh usempi=1 usemetis=1 openmp=1 hdf5=1

      # Explicit host mode validates transport/indexing, not GPU execution.
      - name: check host halo kernels in both standards
        run: |
          for cpp_std in c++17 c++20; do
            python3 tests/functional/mpi/run_accelerator_checks.py --mode host \
              --std "$cpp_std" --ranks 1 2 3 4 \
              --launcher 'mpiexec --oversubscribe --bind-to none' \
              --workdir "/tmp/des-halo-$cpp_std"
          done

      - name: compare PT mechanics with the serial solver
        run: |
          for nd in 2 3; do
            make -j4 ndims=$nd hdf5=1
          done
          /usr/bin/python3 tests/functional/mpi/run_pt_mpi.py \
            --serial ./dynearthsol2d --mpi ./dynearthsol2d.mpi \
            --serial3d ./dynearthsol3d --mpi3d ./dynearthsol3d.mpi \
            --ranks 3 4 --cases elastic maxwell hydrostatic dynamic failure \
            --launcher 'mpiexec --oversubscribe --bind-to none' \
            --workdir /tmp/des-pt-mpi

      - name: retain compatibility logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpi-cxx-compatibility
          retention-days: 7
          path: |
            build-cxx20-*.log
            cxx20-*.txt
            /tmp/des-halo-*/accelerator-*/results.json
            /tmp/des-halo-*/accelerator-*/*.log
            /tmp/des-pt-mpi/pt-mpi-*/results.json
            /tmp/des-pt-mpi/pt-mpi-*/*.log
            /tmp/des-pt-mpi/pt-mpi-*/*/*.log
