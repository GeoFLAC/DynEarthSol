name: Notify des-inputgen when input.cxx changes

on:
  push:
    branches: [master, main]
    paths:
      - 'input.cxx'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Generate a dynamic access token using your GitHub App
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: 'GeoFLAC'
          repositories: 'des-inputgen'

      # Step 2: Use the generated token to dispatch the event
      - name: Dispatch event to des-inputgen
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'GeoFLAC',
              repo: 'des-inputgen',
              event_type: 'input-cxx-changed',
              client_payload: {
                sha: context.sha,
                ref: context.ref,
                commit_url: `https://github.com/GeoFLAC/DynEarthSol/commit/${context.sha}`,
              },
            });
