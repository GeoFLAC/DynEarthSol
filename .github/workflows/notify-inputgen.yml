name: Notify des-inputgen when input.cxx changes

on:
  push:
    branches: [master, main]
    paths:
      - 'input.cxx'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: softprops/create-github-app-token@v1
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Test generated token
        env:
          APP_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "ERROR: APP_TOKEN is empty — token generation failed"
            exit 1
          fi
          echo "Testing token by requesting repo info for GeoFLAC/des-inputgen..."
          http_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $APP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/GeoFLAC/des-inputgen")
          echo "HTTP status: $http_code"
          if [ "$http_code" -ne 200 ]; then
            echo "Token test failed (HTTP $http_code). Check installation and permissions."
            exit 1
          fi
          echo "Token test succeeded."

      - name: Dispatch event to des-inputgen (via REST)
        env:
          APP_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "ERROR: APP_TOKEN is empty — token generation failed"
            exit 1
          fi
          payload=$(cat <<EOF
{"event_type":"input-cxx-changed","client_payload":{"sha":"${GITHUB_SHA}","ref":"${GITHUB_REF}","commit_url":"https://github.com/GeoFLAC/DynEarthSol/commit/${GITHUB_SHA}"}}
EOF
)
          http_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $APP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/GeoFLAC/des-inputgen/dispatches" \
            -d "$payload")
          echo "Dispatch HTTP status: $http_code"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Dispatch created (HTTP $http_code)"
          else
            echo "Dispatch failed (HTTP $http_code)"
            exit 1
          fi
